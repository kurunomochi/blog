    <style>
      .filter-toolbar {
        align-items: end;
      }
      .filter-toolbar label {
        display: grid;
        gap: 8px;
      }
      .filter-toolbar label:first-child {
        flex: 1;
      }
      .filter-toolbar input {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.65);
        color: var(--ink);
        font: inherit;
        box-sizing: border-box;
      }
      .filter-toolbar input:focus-visible {
        outline: 2px solid #486a48;
        outline-offset: 2px;
      }
      .list-pagination button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      @media (max-width: 640px) {
        .filter-toolbar {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
