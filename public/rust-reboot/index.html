              PRAGMA user_version=1;\")?;\n            tx.commit()?;\n        }\n        Ok(Self { connection })\n    }\n    pub fn create(&mut self, input: NewTask) -> Result\u003cTask> {\n        let input = input.validate()?;\n        let tx = self\n            .connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)?;\n        let task = insert(&tx, &input)?;\n        tx.commit()?;\n        Ok(task)\n    }\n    pub fn import(&mut self, inputs: Vec\u003cNewTask>) -> Result\u003cVec\u003cTask>> {\n        if inputs.is_empty() || inputs.len() > 100 {\n            return Err(Error::Invalid(\"导入数量需为 1—100\".into()));\n        }\n        let inputs: Vec\u003c_> = inputs\n            .into_iter()\n            .map(NewTask::validate)\n            .collect::\u003cResult\u003c_>>()?;\n        let tx = self\n            .connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)?;\n        let mut created = Vec::with_capacity(inputs.len());\n        for input in &inputs {\n            created.push(insert(&tx, input)?);\n        }\n        tx.commit()?;\n        Ok(created)\n    }\n    pub fn get(&mut self, id: i64) -> Result\u003cTask> {\n        let tx = self.connection.transaction()?;\n        let task = get(&tx, id)?;\n        tx.commit()?;\n        Ok(task)\n    }\n    pub fn update(&mut self, id: i64, change: UpdateTask) -> Result\u003cTask> {\n        let input = change.validated_values()?;\n        let tx = self\n            .connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)?;\n        let old = get(&tx, id)?;\n        if old.version != change.expected_version {\n            return Err(Error::Conflict);\n        }\n        if !old.status.allows(change.status) {\n            return Err(Error::Invalid(\"已完成任务必须先重新打开为 todo\".into()));\n        }\n        let version = old\n            .version\n            .checked_add(1)\n            .ok_or_else(|| Error::Invalid(\"版本号耗尽\".into()))?;\n        let changed = tx.execute(\n            \"UPDATE tasks SET title=?1,description=?2,priority=?3,status=?4,due_at=?5,\n            version=?6,updated_at=?7 WHERE id=?8 AND version=?9\",\n            params![\n                input.title,\n                input.description,\n                input.priority,\n                change.status.as_str(),\n                input.due_at,\n                version,\n                now(),\n                id,\n                change.expected_version\n            ],\n        )?;\n        if changed != 1 {\n            return Err(Error::Conflict);\n        }\n        tx.execute(\"DELETE FROM task_tags WHERE task_id=?1\", [id])?;\n        write_tags(&tx, id, &input.tags)?;\n        event(&tx, id, \"updated\")?;\n        let task = get(&tx, id)?;\n        tx.commit()?;\n        Ok(task)\n    }\n    pub fn delete(&mut self, id: i64, version: i64) -> Result\u003c()> {\n        if version \u003c 1 {\n            return Err(Error::Invalid(\"expected_version 必须为正数\".into()));\n        }\n        let tx = self\n            .connection\n            .transaction_with_behavior(TransactionBehavior::Immediate)?;\n        let task = get(&tx, id)?;\n        if task.version != version {\n            return Err(Error::Conflict);\n        }\n        tx.execute(\n            \"DELETE FROM tasks WHERE id=?1 AND version=?2\",\n            params![id, version],\n        )?;\n        event(&tx, id, \"deleted\")?;\n        tx.commit()?;\n        Ok(())\n    }\n    pub fn list(&mut self, filter: Filter) -> Result\u003cPage\u003cTask>> {\n        filter.validate()?;\n        let tx = self.connection.transaction()?; // total、任务和标签来自同一个读取快照。\n        let status = filter.status.map(Status::as_str);\n        let tag = filter.tag.map(|t| t.trim().to_lowercase());\n        let predicate=\" WHERE (:q IS NULL OR instr(lower(title),lower(:q))>0 OR instr(lower(description),lower(:q))>0)\n            AND (:status IS NULL OR status=:status) AND (:priority IS NULL OR priority=:priority)\n            AND (:tag IS NULL OR EXISTS(SELECT 1 FROM task_tags WHERE task_id=tasks.id AND tag=:tag))\";\n        let parameters =\n            named_params! {\":q\":filter.q,\":status\":status,\":priority\":filter.priority,\":tag\":tag};\n        let total = tx.query_row(\n            &format!(\"SELECT count(*) FROM tasks{predicate}\"),\n            parameters,\n            |r| r.get(0),\n        )?;\n        let mut statement=tx.prepare(&format!(\"SELECT id FROM tasks{predicate} ORDER BY priority DESC,id DESC LIMIT :limit OFFSET :offset\"))?;\n        let ids=statement.query_map(named_params!{\":q\":filter.q,\":status\":status,\":priority\":filter.priority,\":tag\":tag,\":limit\":filter.limit,\":offset\":filter.offset},|r|r.get::\u003c_,i64>(0))?\n            .collect::\u003cstd::result::Result\u003cVec\u003c_>,_>>()?;\n        drop(statement);\n        let items = ids\n            .into_iter()\n            .map(|id| get(&tx, id))\n            .collect::\u003cResult\u003c_>>()?;\n        tx.commit()?;\n        Ok(Page {\n            items,\n            total,\n            limit: filter.limit,\n            offset: filter.offset,\n        })\n    }\n    pub fn stats(&self) -> Result\u003cStats> {\n        Ok(self.connection.query_row(\"SELECT count(*),coalesce(sum(status='todo'),0),coalesce(sum(status='doing'),0),coalesce(sum(status='done'),0) FROM tasks\",[],|r|Ok(Stats{total:r.get(0)?,todo:r.get(1)?,doing:r.get(2)?,done:r.get(3)?}))?)\n    }\n    pub fn events(&self) -> Result\u003cVec\u003cEvent>> {\n        let mut statement = self\n            .connection\n            .prepare(\"SELECT id,task_id,action,at FROM events ORDER BY id DESC LIMIT 100\")?;\n        Ok(statement\n            .query_map([], |r| {\n                Ok(Event {\n                    id: r.get(0)?,\n                    task_id: r.get(1)?,\n                    action: r.get(2)?,\n                    at: r.get(3)?,\n                })\n            })?\n            .collect::\u003cstd::result::Result\u003cVec\u003c_>, _>>()?)\n    }\n    /// 便携内容导出：故意不保留 ID、版本、状态和历史。导入会创建新的 Todo 任务。\n    pub fn export(&mut self) -> Result\u003cVec\u003cNewTask>> {\n        let tx = self.connection.transaction()?;\n        let mut statement = tx.prepare(\"SELECT id FROM tasks ORDER BY id\")?;\n        let ids = statement\n            .query_map([], |r| r.get::\u003c_, i64>(0))?\n            .collect::\u003cstd::result::Result\u003cVec\u003c_>, _>>()?;\n        drop(statement);\n        let result = ids\n            .into_iter()\n            .map(|id| {\n                let t = get(&tx, id)?;\n                Ok(NewTask {\n                    title: t.title,\n                    description: t.description,\n                    priority: t.priority,\n                    tags: t.tags,\n                    due_at: t.due_at,\n                })\n            })\n            .collect::\u003cResult\u003cVec\u003c_>>>()?;\n        tx.commit()?;\n        Ok(result)\n    }\n}\nfn write_tags(c: &Connection, id: i64, tags: &[String]) -> Result\u003c()> {\n    for tag in tags {\n        c.execute(\n            \"INSERT INTO task_tags(task_id,tag) VALUES(?1,?2)\",\n            params![id, tag],\n        )?;\n    }\n    Ok(())\n}\nfn event(c: &Connection, id: i64, action: &str) -> Result\u003c()> {\n    c.execute(\n        \"INSERT INTO events(task_id,action,at) VALUES(?1,?2,?3)\",\n        params![id, action, now()],\n    )?;\n    Ok(())\n}\nfn insert(c: &Connection, input: &NewTask) -> Result\u003cTask> {\n    let time = now();\n    c.execute(\"INSERT INTO tasks(title,description,priority,status,due_at,version,created_at,updated_at) VALUES(?1,?2,?3,'todo',?4,1,?5,?5)\",params![input.title,input.description,input.priority,input.due_at,time])?;\n    let id = c.last_insert_rowid();\n    write_tags(c, id, &input.tags)?;\n    event(c, id, \"created\")?;\n    get(c, id)\n}\nfn get(c: &Connection, id: i64) -> Result\u003cTask> {\n    let raw=c.query_row(\"SELECT id,title,description,priority,status,due_at,version,created_at,updated_at FROM tasks WHERE id=?1\",[id],|r|Ok((r.get::\u003c_,i64>(0)?,r.get::\u003c_,String>(1)?,r.get::\u003c_,String>(2)?,r.get::\u003c_,u8>(3)?,r.get::\u003c_,String>(4)?,r.get::\u003c_,Option\u003ci64>>(5)?,r.get::\u003c_,i64>(6)?,r.get::\u003c_,i64>(7)?,r.get::\u003c_,i64>(8)?))).optional()?.ok_or(Error::NotFound(id))?;\n    let mut statement = c.prepare(\"SELECT tag FROM task_tags WHERE task_id=?1 ORDER BY tag\")?;\n    let tags = statement\n        .query_map([id], |r| r.get(0))?\n        .collect::\u003cstd::result::Result\u003cVec\u003cString>, _>>()?;\n    Ok(Task {\n        id: raw.0,\n        title: raw.1,\n        description: raw.2,\n        priority: raw.3,\n        status: Status::parse(&raw.4)?,\n        due_at: raw.5,\n        version: raw.6,\n        created_at: raw.7,\n        updated_at: raw.8,\n        tags,\n    })\n}\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn rollback_on_mid_batch_database_failure() {\n        let mut repo = Repository::memory().unwrap();\n        repo.connection.execute_batch(\"CREATE TRIGGER reject_bad BEFORE INSERT ON tasks WHEN NEW.title='reject' BEGIN SELECT RAISE(ABORT,'test failure'); END;\").unwrap();\n        assert!(\n            repo.import(vec![NewTask::simple(\"first\"), NewTask::simple(\"reject\")])\n                .is_err()\n        );\n        assert_eq!(repo.stats().unwrap().total, 0);\n        assert!(repo.events().unwrap().is_empty());\n    }\n}\n"},{"path":"src/service.rs","code":"use crate::{\n    error::{Error, Result},\n    repository::Repository,\n};\nuse std::sync::{Arc, Mutex};\nuse tokio::sync::Semaphore;\n\n/// rusqlite 是同步接口。锁只存在于阻塞工作线程中，不在 async 线程持锁等待。\n#[derive(Clone)]\npub struct Database {\n    inner: Arc\u003cMutex\u003cRepository>>,\n    slots: Arc\u003cSemaphore>,\n}\nimpl Database {\n    pub fn new(repository: Repository) -> Self {\n        Self {\n            inner: Arc::new(Mutex::new(repository)),\n            slots: Arc::new(Semaphore::new(32)),\n        }\n    }\n    pub async fn call\u003cF, T>(&self, operation: F) -> Result\u003cT>\n    where\n        F: FnOnce(&mut Repository) -> Result\u003cT> + Send + 'static,\n        T: Send + 'static,\n    {\n        let permit = self\n            .slots\n            .clone()\n            .try_acquire_owned()\n            .map_err(|_| Error::Busy)?;\n        let inner = self.inner.clone();\n        tokio::task::spawn_blocking(move || {\n            let _permit = permit; // 真实阻塞工作结束时才释放并发名额。\n            let mut repository = inner\n                .lock()\n                .map_err(|_| Error::Internal(\"数据库锁已中毒\".into()))?;\n            operation(&mut repository)\n        })\n        .await\n        .map_err(|e| Error::Internal(format!(\"数据库工作线程失败：{e}\")))?\n    }\n}\n"},{"path":"src/jobs.rs","code":"use crate::{\n    domain::NewTask,\n    error::{Error, Result},\n    service::Database,\n};\nuse serde::{Deserialize, Serialize};\nuse std::{\n    collections::BTreeMap,\n    sync::{\n        Arc, Mutex,\n        atomic::{AtomicU64, Ordering},\n    },\n};\nuse tokio::{sync::mpsc, task::JoinHandle};\n\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\n#[serde(rename_all = \"snake_case\")]\npub enum JobStatus {\n    Queued,\n    Running,\n    Succeeded,\n    Failed,\n}\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Job {\n    pub id: u64,\n    pub status: JobStatus,\n    pub created_ids: Vec\u003ci64>,\n    pub error: Option\u003cString>,\n}\nstruct Request {\n    id: u64,\n    tasks: Vec\u003cNewTask>,\n}\n#[derive(Clone)]\npub struct Jobs {\n    sender: mpsc::Sender\u003cRequest>,\n    records: Arc\u003cMutex\u003cBTreeMap\u003cu64, Job>>>,\n    sequence: Arc\u003cAtomicU64>,\n}\nimpl Jobs {\n    /// 队列最多 8 个待处理批次，单 worker；最多保留 256 条记录。\n    /// 记录只在内存中，重启后清空；SQLite 已提交的任务会保留。\n    pub fn start(database: Database) -> (Self, JoinHandle\u003c()>) {\n        let (sender, mut receiver) = mpsc::channel::\u003cRequest>(8);\n        let records = Arc::new(Mutex::new(BTreeMap::\u003cu64, Job>::new()));\n        let worker_records = records.clone();\n        let worker = tokio::spawn(async move {\n            while let Some(request) = receiver.recv().await {\n                if let Ok(mut records) = worker_records.lock() {\n                    if let Some(job) = records.get_mut(&request.id) {\n                        job.status = JobStatus::Running;\n                    }\n                }\n                let result = database.call(move |repo| repo.import(request.tasks)).await;\n                if let Ok(mut records) = worker_records.lock() {\n                    if let Some(job) = records.get_mut(&request.id) {\n                        match result {\n                            Ok(tasks) => {\n                                job.status = JobStatus::Succeeded;\n                                job.created_ids = tasks.into_iter().map(|t| t.id).collect();\n                            }\n                            Err(error) => {\n                                job.status = JobStatus::Failed;\n                                job.error = Some(match error {\n                                    Error::Database(_) | Error::Internal(_) => {\n                                        \"后台存储失败，请查看服务日志并核对数据库\".into()\n                                    }\n                                    other => other.to_string(),\n                                });\n                            }\n                        }\n                    }\n                }\n            }\n        });\n        (\n            Self {\n                sender,\n                records,\n                sequence: Arc::new(AtomicU64::new(1)),\n            },\n            worker,\n        )\n    }\n    pub fn submit(&self, tasks: Vec\u003cNewTask>) -> Result\u003cJob> {\n        if tasks.is_empty() || tasks.len() > 100 {\n            return Err(Error::Invalid(\"任务数需为 1—100\".into()));\n        }\n        let tasks = tasks\n            .into_iter()\n            .map(NewTask::validate)\n            .collect::\u003cResult\u003cVec\u003c_>>>()?;\n        let id = self\n            .sequence\n            .fetch_update(Ordering::Relaxed, Ordering::Relaxed, |n| n.checked_add(1))\n            .map_err(|_| Error::Internal(\"job ID 耗尽\".into()))?;\n        let job = Job {\n            id,\n            status: JobStatus::Queued,\n            created_ids: vec![],\n            error: None,\n        };\n        let mut records = self\n            .records\n            .lock()\n            .map_err(|_| Error::Internal(\"job 锁已中毒\".into()))?;\n        if records.len() >= 256 {\n            let old = records\n                .iter()\n                .find(|(_, j)| matches!(j.status, JobStatus::Succeeded | JobStatus::Failed))\n                .map(|(id, _)| *id);\n            if let Some(old) = old {\n                records.remove(&old);\n            } else {\n                return Err(Error::Busy);\n            }\n        }\n        records.insert(id, job.clone());\n        if self.sender.try_send(Request { id, tasks }).is_err() {\n            records.remove(&id);\n            return Err(Error::Busy);\n        }\n        Ok(job)\n    }\n    pub fn get(&self, id: u64) -> Result\u003cJob> {\n        self.records\n            .lock()\n            .map_err(|_| Error::Internal(\"job 锁已中毒\".into()))?\n            .get(&id)\n            .cloned()\n            .ok_or(Error::NotFound(i64::try_from(id).unwrap_or(i64::MAX)))\n    }\n}\n"},{"path":"src/api.rs","code":"use crate::{\n    domain::*,\n    error::Error,\n    jobs::{Job, Jobs},\n    service::Database,\n};\nuse axum::{\n    Json, Router,\n    extract::{DefaultBodyLimit, Path, Query, State},\n    http::{StatusCode, header},\n    response::{IntoResponse, Response},\n    routing::get,\n};\nuse serde::Deserialize;\nuse serde_json::json;\n\n#[derive(Clone)]\npub struct AppState {\n    pub database: Database,\n    pub jobs: Jobs,\n}\npub fn router(state: AppState) -> Router {\n    Router::new()\n        .route(\"/health\", get(health))\n        .route(\"/tasks\", get(list).post(create))\n        .route(\"/tasks/{id}\", get(detail).put(update).delete(remove))\n        .route(\"/stats\", get(stats))\n        .route(\"/events\", get(events))\n        .route(\"/export\", get(export))\n        .route(\"/jobs/import\", axum::routing::post(import))\n        .route(\"/jobs/{id}\", get(job))\n        .layer(DefaultBodyLimit::max(256 * 1024))\n        .with_state(state)\n}\nimpl IntoResponse for Error {\n    fn into_response(self) -> Response {\n        let (status, code, message) = match &self {\n            Error::Invalid(_) => (\n                StatusCode::UNPROCESSABLE_ENTITY,\n                \"invalid_input\",\n                self.to_string(),\n            ),\n            Error::NotFound(_) => (StatusCode::NOT_FOUND, \"not_found\", self.to_string()),\n            Error::Conflict => (StatusCode::CONFLICT, \"version_conflict\", self.to_string()),\n            Error::Busy => (StatusCode::SERVICE_UNAVAILABLE, \"busy\", self.to_string()),\n            Error::Database(_) | Error::Internal(_) => {\n                eprintln!(\"request failed: {self}\");\n                (\n                    StatusCode::INTERNAL_SERVER_ERROR,\n                    \"internal_error\",\n                    \"内部存储错误\".into(),\n                )\n            }\n        };\n        (\n            status,\n            Json(json!({\"error\":{\"code\":code,\"message\":message}})),\n        )\n            .into_response()\n    }\n}\nasync fn health(State(s): State\u003cAppState>) -> Result\u003cJson\u003cserde_json::Value>, Error> {\n    s.database.call(|r| r.stats()).await?;\n    Ok(Json(json!({\"status\":\"ok\",\"schema\":1})))\n}\nasync fn list(\n    State(s): State\u003cAppState>,\n    Query(filter): Query\u003cFilter>,\n) -> Result\u003cJson\u003cPage\u003cTask>>, Error> {\n    Ok(Json(s.database.call(move |r| r.list(filter)).await?))\n}\nasync fn create(State(s): State\u003cAppState>, Json(input): Json\u003cNewTask>) -> Result\u003cResponse, Error> {\n    let task = s.database.call(move |r| r.create(input)).await?;\n    Ok((\n        StatusCode::CREATED,\n        [(header::LOCATION, format!(\"/tasks/{}\", task.id))],\n        Json(task),\n    )\n        .into_response())\n}\nasync fn detail(State(s): State\u003cAppState>, Path(id): Path\u003ci64>) -> Result\u003cJson\u003cTask>, Error> {\n    Ok(Json(s.database.call(move |r| r.get(id)).await?))\n}\nasync fn update(\n    State(s): State\u003cAppState>,\n    Path(id): Path\u003ci64>,\n    Json(input): Json\u003cUpdateTask>,\n) -> Result\u003cJson\u003cTask>, Error> {\n    Ok(Json(s.database.call(move |r| r.update(id, input)).await?))\n}\n#[derive(Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct Version {\n    expected_version: i64,\n}\nasync fn remove(\n    State(s): State\u003cAppState>,\n    Path(id): Path\u003ci64>,\n    Query(v): Query\u003cVersion>,\n) -> Result\u003cStatusCode, Error> {\n    s.database\n        .call(move |r| r.delete(id, v.expected_version))\n        .await?;\n    Ok(StatusCode::NO_CONTENT)\n}\nasync fn stats(State(s): State\u003cAppState>) -> Result\u003cJson\u003cStats>, Error> {\n    Ok(Json(s.database.call(|r| r.stats()).await?))\n}\nasync fn events(State(s): State\u003cAppState>) -> Result\u003cJson\u003cVec\u003cEvent>>, Error> {\n    Ok(Json(s.database.call(|r| r.events()).await?))\n}\nasync fn export(State(s): State\u003cAppState>) -> Result\u003cJson\u003cVec\u003cNewTask>>, Error> {\n    Ok(Json(s.database.call(|r| r.export()).await?))\n}\nasync fn import(\n    State(s): State\u003cAppState>,\n    Json(tasks): Json\u003cVec\u003cNewTask>>,\n) -> Result\u003c(StatusCode, Json\u003cJob>), Error> {\n    Ok((StatusCode::ACCEPTED, Json(s.jobs.submit(tasks)?)))\n}\nasync fn job(State(s): State\u003cAppState>, Path(id): Path\u003cu64>) -> Result\u003cJson\u003cJob>, Error> {\n    Ok(Json(s.jobs.get(id)?))\n}\n"},{"path":"src/bin/taskboard-server.rs","code":"use rust_taskboard::{\n    api::{AppState, router},\n    jobs::Jobs,\n    repository::Repository,\n    service::Database,\n};\nuse std::{env, net::SocketAddr, path::PathBuf};\n\n#[tokio::main]\nasync fn main() -> Result\u003c(), Box\u003cdyn std::error::Error>> {\n    let path = env::var_os(\"TASKBOARD_DB\")\n        .map(PathBuf::from)\n        .unwrap_or_else(|| \"taskboard.sqlite\".into());\n    let address: SocketAddr = env::var(\"TASKBOARD_BIND\")\n        .unwrap_or_else(|_| \"127.0.0.1:4318\".into())\n        .parse()?;\n    if !address.ip().is_loopback() {\n        return Err(\"学习服务没有认证，只允许绑定回环地址\".into());\n    }\n    let database = Database::new(Repository::open(&path)?);\n    let (jobs, worker) = Jobs::start(database.clone());\n    let app = router(AppState {\n        database,\n        jobs: jobs.clone(),\n    });\n    let listener = tokio::net::TcpListener::bind(address).await?;\n    println!(\"Rust Taskboard: http://{}\", listener.local_addr()?);\n    println!(\"SQLite: {}\", path.display());\n    axum::serve(listener, app)\n        .with_graceful_shutdown(async {\n            let _ = tokio::signal::ctrl_c().await;\n        })\n        .await?;\n    // HTTP 已停止接收请求并完成在途请求；丢弃最后一个 sender 后排空 worker。\n    drop(jobs);\n    worker.await?;\n    Ok(())\n}\n"},{"path":"src/bin/taskboard-cli.rs","code":"use rust_taskboard::{\n    domain::{Filter, NewTask, Status, UpdateTask},\n    repository::Repository,\n};\nuse std::{env, error::Error, fs, path::PathBuf, process::ExitCode};\n\nfn run() -> Result\u003c(), Box\u003cdyn Error>> {\n    let mut raw: Vec\u003c_> = env::args_os().skip(1).collect();\n    let path = if raw.first().is_some_and(|x| x == \"--db\") {\n        if raw.len() \u003c 2 {\n            return Err(\"--db 需要路径\".into());\n        }\n        let path = PathBuf::from(raw.remove(1));\n        raw.remove(0);\n        path\n    } else {\n        env::var_os(\"TASKBOARD_DB\")\n            .map(PathBuf::from)\n            .unwrap_or_else(|| \"taskboard.sqlite\".into())\n    };\n    let args: Vec\u003cString> = raw\n        .into_iter()\n        .map(|s| s.into_string().map_err(|_| \"命令参数需为 UTF-8\"))\n        .collect::\u003cResult\u003c_, _>>()?;\n    let command = args.first().map(String::as_str).unwrap_or(\"help\");\n    if matches!(command, \"help\" | \"--help\") {\n        println!(\n            \"taskboard-cli [--db PATH] COMMAND\\n  add TITLE [PRIORITY]\\n  list [QUERY]\\n  done ID EXPECTED_VERSION\\n  stats\\n  export FILE\\n  import FILE\\n导出是便携内容快照：不保留 ID、完成状态和历史；导入每批最多 100 项。\"\n        );\n        return Ok(());\n    }\n    let rest = &args[1..];\n    match command {\n        \"add\" if (1..=2).contains(&rest.len()) => {}\n        \"list\" if rest.len() \u003c= 1 => {}\n        \"done\" if rest.len() == 2 => {}\n        \"stats\" if rest.is_empty() => {}\n        \"export\" | \"import\" if rest.len() == 1 => {}\n        _ => return Err(\"命令或参数数量不正确；请使用 help\".into()),\n    }\n    let mut repo = Repository::open(path)?;\n    match command {\n        \"add\" => {\n            let mut input = NewTask::simple(&rest[0]);\n            if let Some(p) = rest.get(1) {\n                input.priority = p.parse()?;\n            }\n            println!(\"{}\", serde_json::to_string_pretty(&repo.create(input)?)?);\n        }\n        \"list\" => println!(\n            \"{}\",\n            serde_json::to_string_pretty(&repo.list(Filter {\n                q: rest.first().cloned(),\n                ..Default::default()\n            })?)?\n        ),\n        \"done\" => {\n            let id = rest[0].parse()?;\n            let mut change = UpdateTask::from_task(&repo.get(id)?);\n            change.expected_version = rest[1].parse()?;\n            change.status = Status::Done;\n            println!(\n                \"{}\",\n                serde_json::to_string_pretty(&repo.update(id, change)?)?\n            );\n        }\n        \"stats\" => println!(\"{}\", serde_json::to_string_pretty(&repo.stats()?)?),\n        \"export\" => {\n            let bytes = serde_json::to_vec_pretty(&repo.export()?)?;\n            let mut file = fs::OpenOptions::new()\n                .write(true)\n                .create_new(true)\n                .open(&rest[0])?;\n            std::io::Write::write_all(&mut file, &bytes)?;\n            println!(\"已导出；不会覆盖已有文件\");\n        }\n        \"import\" => {\n            let metadata = fs::metadata(&rest[0])?;\n            if metadata.len() > 256 * 1024 {\n                return Err(\"导入文件不可超过 256 KiB\".into());\n            }\n            let inputs: Vec\u003cNewTask> = serde_json::from_slice(&fs::read(&rest[0])?)?;\n            println!(\"导入 {} 条任务\", repo.import(inputs)?.len());\n        }\n        _ => unreachable!(\"命令已验证\"),\n    }\n    Ok(())\n}\nfn main() -> ExitCode {\n    match run() {\n        Ok(()) => ExitCode::SUCCESS,\n        Err(e) => {\n            eprintln!(\"错误：{e}\");\n            ExitCode::FAILURE\n        }\n    }\n}\n"},{"path":"tests/repository.rs","code":"use rust_taskboard::{domain::*, error::Error, repository::Repository};\nuse std::{\n    fs,\n    path::PathBuf,\n    sync::atomic::{AtomicU64, Ordering},\n};\nstatic NEXT: AtomicU64 = AtomicU64::new(0);\nstruct Temporary(PathBuf);\nimpl Temporary {\n    fn new() -> Self {\n        let p = std::env::temp_dir().join(format!(\n            \"rust-taskboard-{}-{}-{}\",\n            std::process::id(),\n            std::time::SystemTime::now()\n                .duration_since(std::time::UNIX_EPOCH)\n                .unwrap()\n                .as_nanos(),\n            NEXT.fetch_add(1, Ordering::Relaxed)\n        ));\n        fs::create_dir(&p).unwrap();\n        Self(p)\n    }\n}\nimpl Drop for Temporary {\n    fn drop(&mut self) {\n        let _ = fs::remove_dir_all(&self.0);\n    }\n}\n#[test]\nfn validates_and_normalizes() {\n    let mut r = Repository::memory().unwrap();\n    let mut input = NewTask::simple(\"  学习 Rust  \");\n    input.tags = vec![\" Rust \".into(), \"rust\".into(), \"数据库\".into()];\n    let t = r.create(input).unwrap();\n    assert_eq!(t.title, \"学习 Rust\");\n    assert_eq!(t.tags, vec![\"rust\", \"数据库\"]);\n    assert_eq!(t.version, 1);\n    for name in [\" \", \"\\n\", \"bad\\tname\"] {\n        assert!(r.create(NewTask::simple(name)).is_err());\n    }\n    let mut bad = NewTask::simple(\"bad\");\n    bad.priority = 4;\n    assert!(r.create(bad).is_err());\n    assert_eq!(r.stats().unwrap().total, 1);\n}\n#[test]\nfn full_update_has_optimistic_version() {\n    let mut r = Repository::memory().unwrap();\n    let t = r.create(NewTask::simple(\"draft\")).unwrap();\n    let mut edit = UpdateTask::from_task(&t);\n    edit.title = \"new\".into();\n    edit.tags = vec![\"a\".into()];\n    edit.due_at = Some(100);\n    let updated = r.update(t.id, edit.clone()).unwrap();\n    assert_eq!(updated.version, 2);\n    assert_eq!(updated.due_at, Some(100));\n    assert!(matches!(r.update(t.id, edit), Err(Error::Conflict)));\n    assert_eq!(r.get(t.id).unwrap().title, \"new\");\n    let mut clear = UpdateTask::from_task(&updated);\n    clear.due_at = None;\n    clear.tags.clear();\n    assert!(r.update(t.id, clear).unwrap().tags.is_empty());\n}\n#[test]\nfn status_transition_and_delete_conflict() {\n    let mut r = Repository::memory().unwrap();\n    let t = r.create(NewTask::simple(\"task\")).unwrap();\n    let mut c = UpdateTask::from_task(&t);\n    c.status = Status::Done;\n    let done = r.update(t.id, c).unwrap();\n    let mut c = UpdateTask::from_task(&done);\n    c.status = Status::Doing;\n    assert!(matches!(r.update(t.id, c), Err(Error::Invalid(_))));\n    assert!(matches!(r.delete(t.id, 1), Err(Error::Conflict)));\n    r.delete(t.id, done.version).unwrap();\n    assert!(matches!(r.get(t.id), Err(Error::NotFound(_))));\n    assert_eq!(r.events().unwrap()[0].action, \"deleted\");\n    assert!(r.create(NewTask::simple(\"next\")).unwrap().id > t.id);\n}\n#[test]\nfn filter_pagination_and_sql_injection_are_data() {\n    let mut r = Repository::memory().unwrap();\n    for (title, priority) in [(\"Rust low\", 1), (\"Rust high\", 3), (\"Other\", 2)] {\n        let mut t = NewTask::simple(title);\n        t.priority = priority;\n        t.tags = vec![\"study\".into()];\n        r.create(t).unwrap();\n    }\n    let page = r\n        .list(Filter {\n            q: Some(\"rust\".into()),\n            tag: Some(\"STUDY\".into()),\n            limit: 1,\n            ..Default::default()\n        })\n        .unwrap();\n    assert_eq!(page.total, 2);\n    assert_eq!(page.items[0].title, \"Rust high\");\n    assert_eq!(\n        r.list(Filter {\n            q: Some(\"' OR 1=1 --\".into()),\n            ..Default::default()\n        })\n        .unwrap()\n        .total,\n        0\n    );\n    assert!(\n        r.list(Filter {\n            limit: 0,\n            ..Default::default()\n        })\n        .is_err()\n    );\n    assert!(\n        r.list(Filter {\n            offset: -1,\n            ..Default::default()\n        })\n        .is_err()\n    );\n    assert!(\n        r.list(Filter {\n            offset: 100,\n            ..Default::default()\n        })\n        .unwrap()\n        .items\n        .is_empty()\n    );\n}\n#[test]\nfn invalid_batch_is_all_or_nothing() {\n    let mut r = Repository::memory().unwrap();\n    assert!(\n        r.import(vec![NewTask::simple(\"good\"), NewTask::simple(\" \")])\n            .is_err()\n    );\n    assert_eq!(r.stats().unwrap().total, 0);\n    assert!(r.events().unwrap().is_empty());\n}\n#[test]\nfn persistence_across_connections_and_stale_writer() {\n    let tmp = Temporary::new();\n    let path = tmp.0.join(\"db.sqlite\");\n    let task;\n    {\n        let mut first = Repository::open(&path).unwrap();\n        task = first.create(NewTask::simple(\"persisted\")).unwrap();\n    }\n    {\n        let mut a = Repository::open(&path).unwrap();\n        let mut b = Repository::open(&path).unwrap();\n        let old = b.get(task.id).unwrap();\n        let mut edit = UpdateTask::from_task(&old);\n        edit.title = \"writer a\".into();\n        a.update(task.id, edit).unwrap();\n        assert!(matches!(\n            b.update(task.id, UpdateTask::from_task(&old)),\n            Err(Error::Conflict)\n        ));\n        assert_eq!(b.get(task.id).unwrap().title, \"writer a\");\n    }\n}\n#[test]\nfn content_export_creates_fresh_todo_tasks() {\n    let mut source = Repository::memory().unwrap();\n    let task = source.create(NewTask::simple(\"exported\")).unwrap();\n    let mut update = UpdateTask::from_task(&task);\n    update.status = Status::Done;\n    source.update(task.id, update).unwrap();\n    let json = serde_json::to_string(&source.export().unwrap()).unwrap();\n    let mut destination = Repository::memory().unwrap();\n    let imported = destination\n        .import(serde_json::from_str(&json).unwrap())\n        .unwrap();\n    assert_eq!(imported[0].status, Status::Todo);\n    assert_eq!(imported[0].version, 1);\n    assert_eq!(imported[0].title, \"exported\");\n}\n"},{"path":"tests/http.rs","code":"use axum::{\n    Router,\n    body::{Body, to_bytes},\n    http::{Request, StatusCode},\n};\nuse rust_taskboard::{\n    api::{AppState, router},\n    domain::NewTask,\n    jobs::{JobStatus, Jobs},\n    repository::Repository,\n    service::Database,\n};\nuse serde_json::{Value, json};\nuse tower::ServiceExt;\n\nfn app() -> (Router, tokio::task::JoinHandle\u003c()>) {\n    let db = Database::new(Repository::memory().unwrap());\n    let (jobs, worker) = Jobs::start(db.clone());\n    (router(AppState { database: db, jobs }), worker)\n}\nasync fn request(\n    app: &Router,\n    method: &str,\n    url: &str,\n    value: Option\u003cValue>,\n) -> (StatusCode, Value) {\n    let body = value.map(|v| v.to_string()).unwrap_or_default();\n    let req = Request::builder()\n        .method(method)\n        .uri(url)\n        .header(\"content-type\", \"application/json\")\n        .body(Body::from(body))\n        .unwrap();\n    let response = app.clone().oneshot(req).await.unwrap();\n    let status = response.status();\n    let bytes = to_bytes(response.into_body(), 1_000_000).await.unwrap();\n    (\n        status,\n        serde_json::from_slice(&bytes)\n            .unwrap_or_else(|_| json!({\"text\":String::from_utf8_lossy(&bytes)})),\n    )\n}\n#[tokio::test]\nasync fn crud_conflict_and_json_errors() {\n    let (app, worker) = app();\n    let (status, t) = request(\n        &app,\n        \"POST\",\n        \"/tasks\",\n        Some(json!({\"title\":\"API task\",\"priority\":3,\"tags\":[\"Rust\"]})),\n    )\n    .await;\n    assert_eq!(status, StatusCode::CREATED);\n    assert_eq!(t[\"version\"], 1);\n    let id = t[\"id\"].as_i64().unwrap();\n    let update = json!({\"expected_version\":1,\"title\":\"updated\",\"priority\":3,\"tags\":[],\"status\":\"done\",\"due_at\":null});\n    assert_eq!(\n        request(&app, \"PUT\", &format!(\"/tasks/{id}\"), Some(update.clone()))\n            .await\n            .0,\n        StatusCode::OK\n    );\n    let conflict = request(&app, \"PUT\", &format!(\"/tasks/{id}\"), Some(update)).await;\n    assert_eq!(conflict.0, StatusCode::CONFLICT);\n    assert_eq!(conflict.1[\"error\"][\"code\"], \"version_conflict\");\n    assert_eq!(request(&app, \"GET\", \"/stats\", None).await.1[\"done\"], 1);\n    assert_eq!(\n        request(\n            &app,\n            \"DELETE\",\n            &format!(\"/tasks/{id}?expected_version=2\"),\n            None\n        )\n        .await\n        .0,\n        StatusCode::NO_CONTENT\n    );\n    assert_eq!(\n        request(&app, \"GET\", &format!(\"/tasks/{id}\"), None).await.0,\n        StatusCode::NOT_FOUND\n    );\n    drop(app);\n    worker.await.unwrap();\n}\n#[tokio::test]\nasync fn invalid_inputs_and_request_limit() {\n    let (app, worker) = app();\n    assert_eq!(\n        request(&app, \"POST\", \"/tasks\", Some(json!({\"title\":\" \"})))\n            .await\n            .0,\n        StatusCode::UNPROCESSABLE_ENTITY\n    );\n    assert_eq!(\n        request(&app, \"GET\", \"/tasks?limit=0\", None).await.0,\n        StatusCode::UNPROCESSABLE_ENTITY\n    );\n    assert_eq!(\n        request(&app, \"POST\", \"/tasks\", Some(json!({\"title\":\"x\",\"typo\":1})))\n            .await\n            .0,\n        StatusCode::UNPROCESSABLE_ENTITY\n    );\n    assert_eq!(\n        request(\n            &app,\n            \"POST\",\n            \"/tasks\",\n            Some(json!({\"title\":\"x\",\"description\":\"x\".repeat(300_000)}))\n        )\n        .await\n        .0,\n        StatusCode::PAYLOAD_TOO_LARGE\n    );\n    assert_eq!(request(&app, \"GET\", \"/stats\", None).await.1[\"total\"], 0);\n    drop(app);\n    worker.await.unwrap();\n}\n#[tokio::test]\nasync fn background_import_can_be_observed() {\n    let (app, worker) = app();\n    let (status, accepted) = request(\n        &app,\n        \"POST\",\n        \"/jobs/import\",\n        Some(json!([{\"title\":\"one\"},{\"title\":\"two\"}])),\n    )\n    .await;\n    assert_eq!(status, StatusCode::ACCEPTED);\n    let id = accepted[\"id\"].as_u64().unwrap();\n    tokio::time::timeout(std::time::Duration::from_secs(5), async {\n        loop {\n            let (_, job) = request(&app, \"GET\", &format!(\"/jobs/{id}\"), None).await;\n            if job[\"status\"] == \"succeeded\" {\n                assert_eq!(job[\"created_ids\"].as_array().unwrap().len(), 2);\n                break;\n            }\n            assert_ne!(job[\"status\"], \"failed\");\n            tokio::task::yield_now().await;\n        }\n    })\n    .await\n    .unwrap();\n    assert_eq!(request(&app, \"GET\", \"/stats\", None).await.1[\"total\"], 2);\n    drop(app);\n    worker.await.unwrap();\n}\n#[tokio::test]\nasync fn bounded_queue_rejects_and_drains() {\n    let database = Database::new(Repository::memory().unwrap());\n    let (jobs, worker) = Jobs::start(database.clone());\n    // 当前线程 runtime 在本段无 await，因此 worker 尚未读取队列。\n    let mut ids = vec![];\n    for n in 0..8 {\n        ids.push(\n            jobs.submit(vec![NewTask::simple(format!(\"task {n}\"))])\n                .unwrap()\n                .id,\n        );\n    }\n    assert!(jobs.submit(vec![NewTask::simple(\"full\")]).is_err());\n    tokio::time::timeout(std::time::Duration::from_secs(5), async {\n        loop {\n            if jobs.get(*ids.last().unwrap()).unwrap().status == JobStatus::Succeeded {\n                break;\n            }\n            tokio::task::yield_now().await;\n        }\n    })\n    .await\n    .unwrap();\n    drop(jobs);\n    worker.await.unwrap();\n    assert_eq!(database.call(|r| r.stats()).await.unwrap().total, 8);\n}\n#[tokio::test]\nasync fn concurrent_writers_do_not_silently_overwrite() {\n    let (app, worker) = app();\n    let (_, task) = request(&app, \"POST\", \"/tasks\", Some(json!({\"title\":\"original\"}))).await;\n    let url = format!(\"/tasks/{}\", task[\"id\"].as_i64().unwrap());\n    let update = |title: &str| json!({\"expected_version\":1,\"title\":title,\"priority\":2,\"tags\":[],\"status\":\"doing\",\"due_at\":null});\n    let (a, b) = tokio::join!(\n        request(&app, \"PUT\", &url, Some(update(\"a\"))),\n        request(&app, \"PUT\", &url, Some(update(\"b\")))\n    );\n    let mut statuses = [a.0.as_u16(), b.0.as_u16()];\n    statuses.sort();\n    assert_eq!(statuses, [200, 409]);\n    assert_eq!(request(&app, \"GET\", &url, None).await.1[\"version\"], 2);\n    drop(app);\n    worker.await.unwrap();\n}\n"}],"codeArchive":"UEsDBBQAAAAIAAC4aV3ReeL5KgAAADwAAAAKAAAALmdpdGlnbm9yZdPS0i9JLEpPLdHn0tJLSQITekmJ2UBGcWFOZkkqnKFbnpiD4BRn5HIBAFBLAwQUAAAACAByU2ldkC5e9H0AAACaAAAAEwAAAGNhcHN0b25lL0NhcmdvLmxvY2tNirEKwjAQQPf7iiOdDRVcBcHJ3a10OJtrPEwvklyE/r1xc3rw3hvw/pSKqyTGTmqWNzJZKKUdL5GVCxkHfOx4pRKzhwFv9ls1d6ixhp7XXHAjbZSQg5ho9PDhUiUrnvEEME1vWl4UeZ5BaeNuXWnVDlZIkvub3eiPfnTwBVBLAwQUAAAACABvUmldbLA82FUAAABdAAAAEwAAAGNhcHN0b25lL0NhcmdvLnRvbWyLLkhMzk5MT43lykvMTVWwVVA <script>'use strict';
const { lessons, phases, exercises, plan } = COURSE;
const packageUrl = COURSE.codeArchive ? 'data:application/zip;base64,' + COURSE.codeArchive : 'rust-code.zip';
const $ = (selector, root = document) => root.querySelector(selector);
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'rust-reboot-v1';
const lessonById = Object.fromEntries(lessons.map(l => [l.id, l]));
const questions = lessons.flatMap(l => l.quiz.map((q, i) => ({id:`${l.id}-${i}`,lesson:l.id,phase:l.phase,q})));
const questionById = Object.fromEntries(questions.map(q => [q.id,q]));
const initialState = () => ({version:1,completed:[],notes:{},answers:{},milestones:[],last:'01',theme:'light'});
function sanitize(input) {
  if (!input || input.version !== 1) throw new Error('不是兼容的 Rust Reboot 学习记录');
  const s = initialState();
  s.completed = [...new Set((Array.isArray(input.completed) ? input.completed : []).filter(id=>Object.hasOwn(lessonById,id)))];
  for (const l of lessons) {
    if (typeof input.notes?.[l.id] === 'string') s.notes[l.id] = input.notes[l.id].slice(0,20000);
  }
  for (const q of questions) {
    const choice = input.answers?.[q.id];
    if (Number.isInteger(choice) && choice>=0 && choice<q.q[1].length) s.answers[q.id]=choice;
  }
  s.milestones = [...new Set((Array.isArray(input.milestones)?input.milestones:[]).filter(v=>Number.isInteger(v)&&v>=0&&v<6))];
  s.last = Object.hasOwn(lessonById,input.last) ? input.last : '01';
  s.theme = input.theme==='dark' ? 'dark':'light';
  return s;
}
let state=initialState(), storageAvailable=true, toastTimer, quizPage=0, quizFilter='all', quizPhase='all';
try { const raw=localStorage.getItem(KEY); if(raw) state=sanitize(JSON.parse(raw)); } catch { storageAvailable=false; }
document.body.classList.toggle('dark',state.theme==='dark');
function notify(message) { $('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4000); }
function save() {
  try { localStorage.setItem(KEY,JSON.stringify(state)); storageAvailable=true; }
  catch { if(storageAvailable) notify('浏览器存储不可用或空间不足，请导出记录保存。'); storageAvailable=false; }
}
function completed(id){return state.completed.includes(id)}
function quizStats(){const answered=Object.keys(state.answers).length;const correct=questions.filter(q=>state.answers[q.id]===q.q[2]).length;return {answered,correct,wrong:answered-correct};}
function updateProgress(){
  const count=state.completed.length, percent=Math.round(count/lessons.length*100);
  $('#side-count').textContent=count;$('#side-percent').textContent=percent+'%';$('#side-bar').style.width=percent+'%';
  document.querySelectorAll('[data-quiz-count]').forEach(el=>el.textContent=quizStats().answered);
  document.querySelectorAll('[data-quiz-correct]').forEach(el=>el.textContent=quizStats().correct);
}
const action=(name,label,cls='',extra='')=>`<button class="btn ${cls}" data-action="${name}" ${extra}>${label}</button>`;
const link=(route,label,cls='')=>`<a class="btn ${cls}" href="#${route}">${label}</a>`;
const footer=()=>`<footer class="footer"><span>RUST REBOOT / 从重新理解，到独立构建。</span><span>官方资料核对：2026-11-09 · 代码验证环境：Rust 1.97.1</span></footer>`;
function heading(kicker,title,sub,aside=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div>${aside}</div>`;}
function syntax(code){
  return code.replace(/\/\/[^\n]*|"(?:\\.|[^"\\])*"|\b(?:fn|let|mut|pub|use|impl|struct|enum|trait|match|if|else|for|in|while|loop|break|return|async|await|move|unsafe|mod|const|where|type|self|Self|dyn|true|false)\b|\b\d+(?:_\d+)*\b|[&<>"']/g,token=>{
    let cls=token.startsWith('//')?'comment':token.startsWith('"')&&token.length>1?'string':/^\d/.test(token)?'number':/^\w/.test(token)?'key':'';
    return cls?`<span class="tok-${cls}">${esc(token)}</span>`:esc(token);
  });
}
function codeBlock(code,label='terminal',rust=false){return `<div class="code-panel"><div class="code-bar"><span>${esc(label)}</span><button type="button" data-action="copy" aria-label="复制 ${esc(label)}">复制代码</button></div><pre><code>${rust?syntax(code):esc(code)}</code></pre></div>`;}
function lessonCard(l){return `<a class="lesson-card" href="#lesson/${l.id}"><span class="number">CHAPTER ${l.id}</span>${completed(l.id)?'<span class="complete-dot">✓ 已掌握</span>':''}<h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p><div class="card-foot"><span>${esc(phases[l.phase][0])}</span><span>讲解 · 示例 · 练习 <span class="arrow">↗</span></span></div></a>`;}

function quizCard(question){

 `<div class="notice"><strong>项目分两级，不跳过中间步骤</strong>先做 ${'<a class="source" href="#starter">Rust Trail 入门 CLI</a>'}，再完成本页的进阶项目。进阶项目具有独立 Cargo.toml 与锁文件，源码全部内嵌在本 HTML 中，第一次构建第三方依赖需要联网。</div>

 <div class="resource-grid"><div class="resource"><h3>真实的业务能力</h3><p>任务增删改查、优先级与标签、状态流转、截止时间字段、组合筛选、稳定分页、便携内容导出，以及后台批量导入。</p><span class="tag green">2 个二进制入口</span> <span class="tag green">6 个核心模块</span></div><div class="resource"><h3>明确的工程保证</h3><p>版本号阻止陈旧覆盖；任务、标签与审计同一事务提交；读取快照保持分页一致；队列与阻塞工作有上限；错误有可辨识状态码。</p><span class="tag orange">先理解边界，再增加功能</span></div></div>

 <div class="section-title"><h2>直接打开真实项目源码</h2></div><div class="resource-grid">${COURSE.projectFiles.map((f,i)=>`<a class="resource" href="#source/${i}"><h3>${esc(f.path)} ↗</h3><p>${f.code.split('\n').length} 行 · 与下载工程同源</p></a>`).join('')}</div>

function render(){
 const [page='home',arg]=location.hash.slice(1).split('/');const routes={home:advancedHome,course:()=>course(arg),lesson:()=>lesson(arg),practice,quiz,project:advancedProject,starter:project,guide:()=>guide(arg),source:()=>projectSource(arg),plan:roadmap,notes,reference};
 const current=Object.hasOwn(routes,page)?page:'home';$('#main').innerHTML=routes[current]();
 const names={home:'学习总览',course:'完整复习手册',lesson:'阅读章节',practice:'动手练习',quiz:'知识自测',project:'进阶综合项目',starter:'入门 CLI 项目',guide:'工程分步导读',source:'项目源码阅读',plan:'14 天复习路线',notes:'笔记与学习记录',reference:'速查表与资料'};
 $('#breadcrumb').textContent=names[current];document.title=`${current==='lesson'&&lessonById[arg]?lessonById[arg].title:names[current]} · Rust Reboot`;
 document.querySelectorAll('[data-nav]').forEach(el=>{const active=el.dataset.nav===(current==='lesson'?'course':['starter','guide','source'].includes(current)?'project':current);el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});updateProgress();
}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.left='-9999px';document.body.append(area);area.select();const success=document.execCommand('copy');area.remove();if(!success)throw new Error('copy unavailable');}
}
document.addEventListener('click',async event=>{
 const scroll=event.target.closest('[data-scroll]');if(scroll){event.preventDefault();const target=document.getElementById(scroll.dataset.scroll);target?.scrollIntoView({behavior:'smooth'});if(scroll.dataset.scroll==='main')target?.focus({preventScroll:true});return;}
 const button=event.target.closest('[data-action]');if(!button)return;const name=button.dataset.action;
 if(name==='copy'){try{await copyText(button.closest('.code-panel').querySelector('code').textContent);notify('代码已复制');}catch{notify('复制不可用，请选中代码手动复制。');}}
 if(name==='complete'){const id=button.dataset.id;state.completed=completed(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();updateProgress();button.textContent=completed(id)?'✓ 已掌握 · 点击撤销':'标记为已掌握';notify(completed(id)?'已记录这一章的进度':'已撤销完成标记');}
 if(name==='print')window.print();
 if(name==='export')download('rust-reboot-progress.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');
 if(name==='import')$('#import-file').click();
 if(name==='reset')$('#reset-dialog').showModal();
 if(name==='cancel-reset')$('#reset-dialog').close();
 if(name==='confirm-reset'){const theme=state.theme;state=initialState();state.theme=theme;save();$('#reset-dialog').close();render();notify('本地学习记录已清除');}
 if(name==='quiz-filter'){quizFilter=button.dataset.filter;quizPage=0;render();}
 if(name==='quiz-prev'){quizPage=Math.max(0,quizPage-1);render();window.scrollTo(0,0);}
 if(name==='quiz-next'){quizPage++;render();window.scrollTo(0,0);}
});
document.addEventListener('submit',event=>{
 const form=event.target.closest('[data-quiz]');if(!form)return;event.preventDefault();
 const selected=form.querySelector('input:checked');if(!selected)return;const question=questionById[form.dataset.quiz];
 state.answers[question.id]=Number(selected.value);save();updateProgress();form.querySelector('.answer-feedback').innerHTML=feedback(question.q,Number(selected.value)===question.q[2]);form.querySelector('button[type=submit]').textContent='重新检查';
});
document.addEventListener('input',event=>{
 if(event.target.matches('[data-note]')){state.notes[event.target.dataset.note]=event.target.value;save();$('#note-status').textContent=storageAvailable?'已保存到当前浏览器':'未能持久保存，请导出记录';}
});
document.addEventListener('change',event=>{
 if(event.target.matches('[data-milestone]')){const n=Number(event.target.dataset.milestone);state.milestones=event.target.checked?[...new Set([...state.milestones,n])]:state.milestones.filter(v=>v!==n);save();const tag=$('.section-title .tag');if(tag)tag.textContent=`${state.milestones.length} / 6 已验收`;}
 if(event.target.id==='quiz-phase'){quizPhase=event.target.value;quizPage=0;render();}
});
$('#import-file').addEventListener('change',async event=>{
 const file=event.target.files[0];if(!file)return;
 try{if(file.size>2_000_000)throw new Error('文件过大，请选择小于 2 MB 的学习记录');const imported=sanitize(JSON.parse(await file.text()));state={...state,completed:[...new Set([...state.completed,...imported.completed])],notes:{...state.notes,...imported.notes},answers:{...state.answers,...imported.answers},milestones:[...new Set([...state.milestones,...imported.milestones])]};save();render();notify('学习记录已合并导入');}catch(error){notify('导入失败：'+error.message);}event.target.value='';
});
$('#search').addEventListener('input',event=>{const term=event.target.value;if(term.trim())search(term);else render();});
$('#theme-toggle').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.body.classList.toggle('dark',state.theme==='dark');save();});
$('#menu-toggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',open);});
document.addEventListener('click',event=>{if(!event.target.closest('.sidebar')&&!event.target.closest('#menu-toggle')){$('#sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){event.preventDefault();$('#search').focus();}if(event.key==='Escape'){$('#sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');if(document.activeElement===$('#search')){$('#search').value='';$('#search').blur();render();}}});
window.addEventListener('hashchange',()=>{$('#search').value='';$('#sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
render();if(!storageAvailable)notify('浏览器本地存储不可用，学习后请导出记录备份。');
