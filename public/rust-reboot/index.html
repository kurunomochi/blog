<script>const COURSE = {"lessons":[{"id":"01","phase":0,"title":"工具链与复习方法","subtitle":"先恢复反馈循环，再恢复语法记忆。","sections":[["三个工具，各司其职","rustup 管理工具链和组件；rustc 编译 Rust 源码；Cargo 组织包、依赖、构建和测试。先运行 rustc --version、cargo --version、rustup show，确认终端实际使用的版本。编辑器建议启用 rust-analyzer；补全只是辅助，编译器诊断才是修改的依据。"],["建立最小反馈循环","cargo new 创建二进制包，cargo new --lib 创建库包。修改代码后先 cargo check，再 cargo test，最后 cargo run。check 通常省去生成可执行文件的成本。--release 使用 release profile；调试构建速度和运行速度不是同一件事。本课程示例使用 edition 2024，在本机 Rust 1.97.1 验证，不把它宣称为最新版本。"],["每章怎么学","先不运行代码，写下你预测的类型、所有权归属和输出；再运行并比较；然后故意改坏一处，阅读第一条诊断，最后不看答案重写。每天留出 10 分钟从空文件复现昨天的重点。学过不等于会用，完成标记应以能解释、能修改、能测试为准。"],["读懂第一条错误","错误通常包括错误码、主错误位置、相关借用或移动发生的位置、帮助建议。先修最早的根因，再重新编译，避免同时处理连锁错误。cargo doc --open 阅读项目文档；rustup doc --book 阅读已安装的离线教材。"],["把第一次运行拆成四步","main 是二进制入口；topic 的类型由字符串字面量推断为 &str；println! 在编译期展开格式化代码；assert_eq! 在运行时比较结果。先 cargo check 只能证明示例能通过编译，再 cargo run 才真正执行最后的断言。Cargo 返回非零退出码时先看是编译错误还是运行 panic。"],["故意制造两类错误","把 2 + 3 的预期改成 6，会通过编译但运行失败；把 2 改成字符串 \"2\"，则在编译阶段失败。分别保存终端输出，解释为什么它们需要不同的修复方法。不要把“编译通过”写成“所有测试通过”。"],["本章验收","能从空目录创建项目；找到 Cargo.toml 和 src/main.rs；解释 check、run、test 的不同；在终端重现一次编译错误和一次断言失败。"]],"code":"fn main() {\n    let topic = \"Rust\";\n    println!(\"重新开始：{topic}\");\n    assert_eq!(2 + 3, 5);\n}","output":"重新开始：Rust","pitfall":"不要把 edition 当作编译器版本。edition 是逐包选择的语言兼容模式；同一个编译器可以编译多个 edition 的包。","task":"运行 examples/ch01.rs，再把断言右侧改为 6，观察编译成功与运行失败的区别。恢复代码后执行 cargo check。","hint":"工作目录进入 workbook；命令为 cargo run --offline --example ch01。assert_eq! 检查的是运行时值。","answer":"断言写成 6 时仍能通过类型检查，但运行时 panic。恢复为 5 后程序正常退出；这说明类型正确并不代表业务逻辑正确。","quiz":[["cargo check 主要检查什么？",["类型与编译正确性","所有业务行为","只检查格式"],0,"check 不能证明业务逻辑正确，也不执行单元测试。"],["edition = \"2024\" 表示？",["必须使用名为 2024 的编译器","使用 2024 兼容规则","每年自动升级"],1,"edition 是 Cargo.toml 的包级设置，需要支持该 edition 的编译器。"]],"source":"https://doc.rust-lang.org/cargo/guide/"},{"id":"02","phase":0,"title":"变量、类型与内存布局","subtitle":"区分值、绑定、可变性和类型推断。","sections":[["不可变绑定与遮蔽","let 默认绑定不可变；mut 允许给同一绑定重新赋值，但类型保持不变。shadowing 用新的 let 创建同名新绑定，可以改变类型；它不是原地改变旧值的类型。const 必须写类型，表达式须能在常量上下文求值；static 表示具有静态存储期的项，修改可变全局状态需要更严格的设计。"],["数值不是无条件互换","默认整数常常推断为 i32，默认浮点常常为 f64，但上下文能改变推断。usize 常用于索引，其宽度取决于目标平台。as 转换可能截断或改变数值解释；对外部输入优先使用 TryFrom。整数溢出的处理受构建配置影响，需要明确语义时使用 checked_*、saturating_* 或 wrapping_*。"],["复合值与 Unicode","元组允许不同元素类型；数组 [T; N] 的长度属于类型；切片 [T] 是动态大小类型，通常通过 &[T] 使用。char 是 Unicode 标量值，占 4 字节，不一定等于用户看到的一个完整字符。布尔条件不能用整数代替。浮点不适合用 == 表达一般近似数值相等，货币等精确值应另行设计。"],["栈和堆只是实现视角","不要记成“简单类型在栈上，复杂类型在堆上”。String 的句柄和值的缓冲区是不同部分，数组也能放进 Box；编译器还可能优化存储。更可靠的问题是：谁拥有资源、值是否 Sized、何时释放、是否发生分配。"],["逐步追踪类型变化","raw 最初是 &str；parse::\u003cu16> 把文本转换为可能失败的结果；expect 在固定演示输入成立的前提下取得 u16。第二次 let 隐藏旧绑定，score 才是可修改的数值。checked_add 不依赖你猜测 debug 或 release 的溢出策略，而是把失败放入 None。"],["不要把 as 当成验证","300_u16 as u8 会发生截断，不等于“确认 300 可以放入 u8”。TryFrom 拒绝越界；输入范围已由协议证明时才能选择其他转换。在调试器中写出转换前后的值，并说明由谁负责证明前提。"],["本章验收","分别解释 let mut、遮蔽、const；能选择合理整数类型；能指出数组长度是类型的一部分；为转换写出 0、255、256 三个边界测试。"]],"code":"fn main() {\n    let raw = \"42\";\n    let raw: u16 = raw.parse().expect(\"固定演示输入\");\n    let mut score = raw;\n    score += 1;\n    let pair: (u16, bool) = (score, true);\n    let xs = [2, 4, 6];\n    assert!(u8::try_from(300_u16).is_err());\n    println!(\"{} {} {}\", pair.0, pair.1, xs.len());\n    println!(\"{:?}\", 255_u8.checked_add(1));\n}","output":"43 true 3\nNone","pitfall":"String::len() 是字节数，chars().count() 是 Unicode 标量值个数，二者都不保证是用户感知字符数。","task":"实现 workbook 的 ex01：接收 u16，通过 TryFrom 返回 Option\u003cu8>；255 成功，256 失败。","hint":"Result::ok() 可以把成功值转为 Some，把错误转为 None。","answer":"u8::try_from(value).ok()。这里把具体转换错误丢弃是刻意的 API 决策；若调用者需要原因，应返回 Result。","quiz":[["let x = \"3\"; let x = x.len(); 是？",["修改字符串内部类型","创建新的同名绑定","非法语法"],1,"遮蔽允许新绑定拥有不同类型。"],["需要明确检测整数加法溢出，选择？",["checked_add","假设 release 一定 panic","无条件 as"],0,"checked_add 用 Option 显式表达无法表示的结果。"]],"source":"https://doc.rust-lang.org/book/ch03-02-data-types.html"},{"id":"03","phase":0,"title":"表达式、函数与控制流","subtitle":"看清末尾分号、返回值和模式。","sections":[["Rust 以表达式组织计算","表达式产生值，语句用于执行动作。代码块的最后一个无分号表达式成为块的值；加上分号通常让结果变成 ()。if 的各分支需要兼容的类型。return 可以提前返回，但函数末尾通常使用尾表达式。函数参数必须声明类型，返回类型默认为 ()。"],["循环也可以产生值","loop 可以通过 break value 返回结果；while 适合条件循环；for 基于 IntoIterator。0..n 不包含 n，0..=n 包含 n。嵌套循环可使用标签控制具体哪一层。遍历容器时优先使用迭代器，而不是反复索引，这样能减少边界和借用问题。"],["模式不是普通赋值","let、函数参数、match、if let 和 while let 都可能使用模式。解构元组或结构体时，绑定模式决定是移动字段还是借用字段。let-else 适合先处理失败路径，它的 else 必须发散，例如 return、break 或 panic。match 守卫可以增加条件，但不能代替穷尽性检查。"],["跟着控制流手工执行","1..=4 依次产生 1、2、3、4，所以 total 为 10；if 两个分支都返回 &str；loop 让 n 依次成为 1 到 5，在 25 > 20 时用 break 5 形成返回值。classify(-1) 首先匹配守卫，不再进入后续范围分支。"],["定位分号造成的类型不匹配","把 classify 的最后一个 match 后面加分号，函数体会变成 ()，而签名声明 &str。修复通常是去掉尾部多余分号；不要为了消除错误而改返回类型，使调用者失去原本需要的结果。"],["本章验收","能画出一次循环的状态表；解释 .. 与 ..=；独立写带守卫的 match；处理 let-else 的退出路径；为分数分类测试每个边界的两侧。"]],"code":"fn classify(n: i32) -> &'static str {\n    match n {\n        n if n \u003c 0 => \"negative\",\n        0 => \"zero\",\n        1..=9 => \"small\",\n        _ => \"large\",\n    }\n}\nfn main() {\n    let total: i32 = (1..=4).sum();\n    let label = if total > 5 { \"high\" } else { \"low\" };\n    let mut n = 0;\n    let found = loop {\n        n += 1;\n        if n * n > 20 { break n; }\n    };\n    println!(\"{total} {label} {found} {}\", classify(-1));\n}","output":"10 high 5 negative","pitfall":"if 条件要求 bool；一个分支返回 String、另一个返回整数不能自动变成“任意类型”。使用 enum 表达不同形态。","task":"写一个 classify_score：0..=59 返回 fail，60..=100 返回 pass，其余返回 invalid。测试 -1、0、59、60、100、101。","hint":"先划分合法范围，match 的最后一个分支覆盖越界值。","answer":"match score { 0..=59 => \"fail\", 60..=100 => \"pass\", _ => \"invalid\" }。边界测试比只测试 75 更有价值。","quiz":[["函数末尾 x + 1; 返回什么？",["x + 1 的值","通常是 ()","自动返回 x"],1,"分号把尾表达式变成语句，若声明返回整数就出现类型不匹配。"],["let Some(x) = value else { ... }; 的 else 应？",["正常继续","必须发散","必须返回 bool"],1,"无法绑定 x 时不能继续进入使用 x 的后续作用域。"]],"source":"https://doc.rust-lang.org/book/ch03-05-control-flow.html"},{"id":"04","phase":1,"title":"所有权、Move、Copy 与 Drop","subtitle":"能画出每个值在每一步属于谁。","sections":[["所有权解决资源释放","一个拥有资源的值在某个时刻由一个所有者负责；所有者结束有效作用域时执行清理。对于 String，清理包括释放缓冲区。移动把责任交给另一个绑定，不代表深复制堆数据。函数按值接收参数、返回值、结构体字段赋值都可能发生移动。"],["Copy 是类型能力","i32 等 Copy 类型赋值后原绑定仍可使用；String 不实现 Copy。Copy 隐含要求 Clone，且实现 Drop 的类型不能同时实现 Copy。Clone 是显式复制行为，其成本由类型决定；Rc::clone 只增加引用计数，而 String::clone 通常复制缓冲区。"],["部分移动与资源管理","从结构体中移动一个非 Copy 字段，可能使整个结构体不再可用，但其他未移动字段仍可能可用；含 Drop 的类型有额外限制。std::mem::take 用 Default 替换原值并取走旧值；Option::take 特别适合从借用的结构体中取出可选资源。不要为了消除报错到处 clone，先判断函数真的需要拥有数据吗。"],["在纸上标出所有者","original → moved 是所有权交接；backup = moved.clone() 创建独立的 String；consume(moved) 再次交出 moved。slot.take() 留下 None 并返回拥有的 String，避免让被借用的位置变成未初始化状态。最后 x 和 y 同时可用，因为 i32 实现 Copy。"],["读懂 E0382 的两个位置","取消原示例中打印 original 的注释，诊断会指出移动发生处与再次使用处。若只想查看长度，可把 consume 改为接收 &str；若调用者不再需要数据，保留按值传递即可。clone 是一个有成本、有语义的选择，不是错误修复的默认按钮。"],["本章验收","能不运行代码说明每个 String 在哪一步被移动、何处释放；能把一个消费式函数改成只读借用；能用 Option::take 从 &mut self 中取走字段。"]],"code":"fn consume(s: String) -> usize { s.len() }\nfn main() {\n    let original = String::from(\"rust\");\n    let moved = original;\n    // println!(\"{original}\"); // E0382：已被移动\n    let backup = moved.clone();\n    let len = consume(moved);\n    let mut slot = Some(backup);\n    let taken = slot.take().unwrap();\n    assert!(slot.is_none());\n    let x = 7;\n    let y = x;\n    println!(\"{taken} {len} {}\", x + y);\n}","output":"rust 4 14","pitfall":"move 不是“强制把值放到堆上”；它描述所有权转移。Drop 也不是垃圾回收器的可达性扫描。","task":"不使用 clone，写一个函数 append_suffix，接收 String，添加 ! 后返回它；主函数继续使用返回的新所有者。","hint":"参数使用 mut text: String，返回值类型也是 String。","answer":"fn append_suffix(mut text: String) -> String { text.push('!'); text }。调用 let text = append_suffix(text); 用遮蔽接住所有权。","quiz":[["String 赋给另一个变量默认？",["深复制","移动","增加引用计数"],1,"String 的拥有权转移，原绑定不再可用。"],["想从 &mut Option\u003cString> 取走内容，可用？",["take()","直接解引用并移动","强制转为 static"],0,"take 留下 None，保持原位置是一个有效值。"]],"source":"https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html"},{"id":"05","phase":1,"title":"借用与可变性","subtitle":"借用是有期限的访问权限。","sections":[["共享访问与独占访问","&T 借用而不转移所有权；&mut T 表示独占的可变访问。对同一位置，在重叠的有效借用期间，不能同时拥有活跃的共享访问和独占访问。可变绑定 let mut x 与可变引用 &mut T 不是一回事：前者允许改绑定，后者允许经由引用修改被指向的值。"],["借用结束不一定等到右大括号","非词法生命周期分析会根据后续使用缩短借用有效期。读取一个引用的最后一次使用后，往往可以再可变借用。反之，只要后面还使用该引用，向 Vec 追加元素就可能冲突，因为追加可能重新分配缓冲区。应调整操作顺序、缩小作用域，或取出 Copy 值。"],["拆分数据而不是绕过检查","编译器能识别结构体不同字段的互不重叠借用，但对运行时下标通常不能证明两个位置不同。切片的 split_at_mut 把一块可变借用安全地拆为两个不相交区间。内部可变性允许经由共享引用修改部分数据，但由 Cell、RefCell、Mutex 等类型维护额外规则。"],["借用的有效期由使用决定","view 被打印后不再使用，normalize 才能获取 title 的独占可变借用。split_at_mut(2) 把同一个数组分成前后两个互不重叠的区间，所以同时修改 left[0] 和 right[0] 不会访问同一元素。这里不是靠你向编译器口头保证下标不同。"],["把错误写法变成安全结构","试写 let a = &mut values[0]; let b = &mut values[1]; println!(\"{a} {b}\");，观察重叠借用诊断。改成 split_at_mut(1)，再从两个区间各取首项。如果只需要先后操作，也可以用两个短作用域，不必保留两个引用。"],["本章验收","能区分绑定可变和目标可变；能解释 Vec::push 为什么可能与元素引用冲突；不依赖 clone 完成原地修改；能说清内部可变性由哪类类型维护。"]],"code":"fn normalize(text: &mut String) { *text = text.trim().to_owned(); }\nfn main() {\n    let mut title = String::from(\"  Rust  \");\n    let view = &title;\n    println!(\"{}\", view.trim()); // view 最后一次使用\n    normalize(&mut title);\n    let mut values = [1, 2, 3, 4];\n    let (left, right) = values.split_at_mut(2);\n    left[0] += 10;\n    right[0] += 20;\n    println!(\"{title} {values:?}\");\n}","output":"Rust\nRust [11, 2, 23, 4]","pitfall":"“不可变引用意味着任何东西都不可能变化”过于绝对：UnsafeCell 支撑的内部可变性是受控例外；普通 &mut 的独占约束仍必须遵守。","task":"实现 ex02：输入 &mut [i32]，把所有负数改成 0，保持长度不变且不分配新 Vec。","hint":"使用 iter_mut()，得到的每个元素类型是 &mut i32；通过 *item 修改。","answer":"for item in values.iter_mut() { if *item \u003c 0 { *item = 0; } }。也可以 *item = (*item).max(0)。","quiz":[["Vec 的元素引用之后还要使用，这时 push 可能失败，因为？",["push 总是非法","可能重新分配，使引用失效","引用自动复制 Vec"],1,"共享引用与可能改变存储的可变借用发生冲突。"],["如何安全借用切片的两个不相交区域？",["split_at_mut","随意构造两个裸指针","把生命周期写大"],0,"API 在检查分割点后封装了不相交访问的证明。"]],"source":"https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html"},{"id":"06","phase":1,"title":"String、str、切片与 Unicode","subtitle":"处理文本时，先确定你操作的是哪种单位。","sections":[["拥有文本与借用文本","String 拥有可增长的 UTF-8 缓冲区；str 是动态大小的 UTF-8 文本，通常通过 &str 使用。只读参数优先 &str，因为它能接收字符串字面量及 String 的借用。需要返回新生成的内容通常返回 String；返回输入的一段则可以返回与输入关联的 &str。"],["字节、标量值和字素簇","len 返回字节数；chars 遍历 Unicode 标量值；用户感知字符可能由多个标量值组合，例如带组合音标的字母或 emoji 序列。字符串不能用整数下标直接索引。&s[a..b] 的边界必须落在 UTF-8 字符边界，否则 panic；s.get(a..b) 会返回 Option。"],["选择不会破坏边界的工具","split_whitespace 处理 Unicode 空白；lines 逐行遍历；char_indices 同时给出字节偏移和标量值。trim 返回借用片段，不分配新字符串；to_owned 或 to_string 产生拥有的文本。ASCII 协议字段可以按字节处理，但用户文本需要明确编码与正规化策略。路径不要默认可以无损转成 UTF-8 String。"],["逐字节理解中文例子","“你”和“好”在 UTF-8 中各占 3 字节，空格和 Rust 占 5 字节，因此总字节数为 11。get(0..1) 截断字符边界，返回 None；get(0..3) 正好借用“你”。chars().take(2).collect::\u003cString>() 创建了新字符串，而 first_word 只是借用原文本。"],["遇到字符串索引需求先问单位","如果题目说“前 10 个字”，先确认指字节、Unicode 标量值还是用户感知字素。日志截断可以保留合法 UTF-8 边界，编辑器光标则通常需要字素处理。中文通过一个简单测试不代表所有 emoji 和组合音标都正确。"],["本章验收","分别写出借用切片和拥有副本的实现；空白输入不 panic；中文边界安全；清楚说明 chars() 并非完整的字素分割器。"]],"code":"fn first_word(text: &str) -> Option\u003c&str> {\n    text.split_whitespace().next()\n}\nfn main() {\n    let text = \"你好 Rust\";\n    println!(\"{} {}\", text.len(), text.chars().count());\n    println!(\"{}\", first_word(text).unwrap());\n    assert!(text.get(0..1).is_none());\n    assert_eq!(text.get(0..3), Some(\"你\"));\n    let initials: String = text.chars().take(2).collect();\n    println!(\"{initials}\");\n}","output":"11 7\n你好\n你好","pitfall":"chars().rev() 反转的是 Unicode 标量值，不是通用的视觉字符反转算法。课程相关练习明确按标量值计算。","task":"实现 ex03：返回首个非空白单词的借用；空串或全部空白返回 None。测试中文和换行。","hint":"split_whitespace().next() 已经覆盖连续空白和空输入。","answer":"fn first_word(text: &str) -> Option\u003c&str> { text.split_whitespace().next() }。无需 clone，也不应返回对临时 String 的引用。","quiz":[["\"你好\".len() 是？",["2","6","取决于系统默认编码"],1,"Rust 的 str 使用 UTF-8，这两个汉字各占 3 字节。"],["适合只读文本的通用参数是？",["&String","&str","String 总是更好"],1,"&str 不要求调用者必须拥有 String。"]],"source":"https://doc.rust-lang.org/book/ch08-02-strings.html"},{"id":"07","phase":1,"title":"结构体、方法与不变量","subtitle":"用类型封装规则，而不只是装数据。","sections":[["结构体代表一组同时存在的信息","命名字段适合领域模型；元组结构体适合简短包装；单元结构体适合无状态标记。字段默认私有。构造时必须提供全部字段，或使用更新语法 ..other；更新语法也可能移动非 Copy 字段。derive 可以为满足约束的字段自动生成 Debug、Clone、PartialEq 等实现。"],["方法接收者表达权限","&self 读取对象；&mut self 修改对象；self 消耗对象。关联函数不接收 self，常用 new、parse 等命名。构造函数不是语言特殊机制，new 只是惯例。不要默认每个结构体都需要 getter/setter，公开哪些操作应由领域规则决定。"],["构造时建立有效性","把字段设为私有，通过返回 Result 的构造函数拒绝无效输入。例如非空标题、正数 ID、受限百分比。之后方法可以依赖这些不变量。newtype 用 struct UserId(u64) 区分语义相近但不可互换的数据，比 type UserId = u64 更有约束力。"],["从构造到方法调用","Lesson::new 先 trim，再判断空标题，成功后才创建拥有的 String。label(&self) 借出字段视图，complete(&mut self) 修改状态。私有字段意味着外部不能绕过构造函数直接创建空标题对象，这使“标题非空”成为类型使用约定。"],["为什么不返回 &String","label 只表达一段只读文本，&str 已经足够；&String 会把调用者与具体容器绑定。若调用者确实需要独立保存它，可自行 to_owned。把复制决策留给真正需要拥有副本的一方。"],["本章验收","独立设计一个 0—100 范围的 Percent newtype；无效值返回 Result；外部不能直接构造非法字段；能解释 self、&self、&mut self 的差别。"]],"code":"#[derive(Debug)]\nstruct Lesson { title: String, done: bool }\nimpl Lesson {\n    fn new(title: &str) -> Result\u003cSelf, &'static str> {\n        if title.trim().is_empty() { return Err(\"empty title\"); }\n        Ok(Self { title: title.trim().to_owned(), done: false })\n    }\n    fn complete(&mut self) { self.done = true; }\n    fn label(&self) -> &str { &self.title }\n}\nfn main() {\n    let mut lesson = Lesson::new(\"所有权\").unwrap();\n    lesson.complete();\n    println!(\"{} {}\", lesson.label(), lesson.done);\n    assert!(Lesson::new(\"  \").is_err());\n}","output":"所有权 true","pitfall":"type UserId = u64 只是别名，不能阻止把订单 ID 当用户 ID 传入。想形成独立类型要用 newtype。","task":"给 Lesson 增加 reset(&mut self)，并说明为何 label 返回 &str 而不是 String。","hint":"reset 只改布尔字段；label 的返回借用由 &self 的生命周期决定。","answer":"fn reset(&mut self) { self.done = false; }。label 不生成新文本，返回 &str 可以避免不必要的分配，并约束引用不能比 Lesson 活得更久。","quiz":[["fn finish(self) 表达什么？",["只读借用","消耗接收者","全局函数"],1,"方法按值接收对象，调用之后原绑定通常被移动。"],["希望 UserId 与 OrderId 不可混用，使用？",["type 别名","两个 newtype","变量名区分即可"],1,"编译器可检查不同结构体类型，变量名不能提供类型隔离。"]],"source":"https://doc.rust-lang.org/book/ch05-03-method-syntax.html"},{"id":"08","phase":1,"title":"枚举、Option 与模式匹配","subtitle":"让不合法状态尽量无法表示。","sections":[["枚举表达互斥状态","struct 的字段同时存在；enum 一次只能是一个变体，每个变体可以携带不同数据。与一组布尔开关相比，enum 能减少无意义组合。例如 Download::Pending、Running { bytes }、Done { path }、Failed { reason }，每个状态只携带它需要的数据。"],["Option 不是特殊的空指针","Option\u003cT> 通过 Some(T) 与 None 显式表达有无值。用 match 处理全部分支，单一成功路径可以 if let，失败提前返回可以 let-else。map 转换里面的值；and_then 用于返回 Option 的转换并避免嵌套；ok_or_else 可以把缺失转为惰性构造的错误。"],["绑定会移动还是借用","match value 可能移动非 Copy 字段；match &value 通常让绑定得到字段借用。as_ref 将 &Option\u003cT> 转换为 Option\u003c&T>，as_deref 进一步应用 Deref，例如 Option\u003cString> 变成 Option\u003c&str>。matches! 适合只判断形状，不取出数据。"],["看状态携带的数据","Queued 不需要进度或路径，Running 只携带进度，Done 才携带路径。describe 接收 &Job，所以匹配 Done(path) 时 path 是借用，调用后 job 仍可使用。返回 String 是因为 format! 产生新文本，不可能借用一个即将销毁的局部字符串。"],["从多个 bool 重构为 enum","想象同时有 is_running、is_done 和 has_error 三个布尔字段，会出现已完成且正在运行等矛盾组合。先列出合法状态，再让 enum 每个变体只保存该状态必需的数据。最后用 match 的穷尽性检查提醒你处理新增状态。"],["本章验收","能使用 match、if let 和 let-else；不 unwrap 用户可选输入；能把 Option\u003cString> 转成 Option\u003c&str>；能解释何时选择 map 与 and_then。"]],"code":"enum Job { Queued, Running(u32), Done(String) }\nfn describe(job: &Job) -> String {\n    match job {\n        Job::Queued => \"waiting\".to_owned(),\n        Job::Running(percent) => format!(\"{percent}%\"),\n        Job::Done(path) => format!(\"saved: {path}\"),\n    }\n}\nfn main() {\n    for job in [Job::Queued, Job::Running(50), Job::Done(\"notes.txt\".into())] {\n        println!(\"{}\", describe(&job));\n    }\n    let title = Some(String::from(\"Rust\"));\n    assert_eq!(title.as_deref(), Some(\"Rust\"));\n}","output":"waiting\n50%\nsaved: notes.txt","pitfall":"unwrap 是对 Some/Ok 的假设，错误时会 panic。可以证明的不变量与不可信用户输入应分开处理。","task":"设计一个连接状态 enum：Disconnected、Connecting、Connected { address }。写只读方法返回说明文本。","hint":"没有必要为 Disconnected 存储一个无意义的空地址。","answer":"enum Connection { Disconnected, Connecting, Connected { address: String } }。说明函数接收 &Connection，通过 match 返回 String，Connected 分支才访问 address。","quiz":[["Option\u003cString>::as_deref() 返回？",["Option\u003c&str>","String","&Option\u003cString>"],0,"先借用内部值，再经 Deref 获得 str 的引用。"],["把 Result 转换函数接到 Option，通常先要？",["明确处理错误或改变返回类型","直接 unwrap 所有结果","用 unsafe"],0,"Option 和 Result 表达不同失败信息，应在 API 层明确转换策略。"]],"source":"https://doc.rust-lang.org/book/ch06-00-enums.html"},{"id":"09","phase":1,"title":"Result、错误传播与错误类型","subtitle":"错误是一条正常的数据通路。","sections":[["何时 Result，何时 panic","可预期失败，如文件不存在、用户输入格式错误，应进入 Result\u003cT, E>。panic 适合程序无法继续满足内部假设的情况，不应替代普通输入验证。库代码应让调用者决定恢复、重试或退出；可执行程序可以在最外层输出错误并选择退出码。"],["问号传播的是控制流","expr? 对 Ok 取值，对 Err 从当前函数提前返回，并在适用处通过 From 转换错误；Option 函数中的 ? 对 None 提前返回。不能无条件在 Result 与 Option 间混用。map_err 改变错误类型，with-context 类方法通常来自第三方库，不属于所有 Result 的内建方法。"],["保留可诊断信息","公共库通常需要可匹配的错误 enum；应用边界可以使用 Box\u003cdyn Error>，或者成熟的应用错误库。实现 Display 面向人类，Debug 面向调试，Error::source 保留底层原因。不要简单把所有错误变成“失败”，应包含操作、输入位置、文件路径等上下文，但避免把凭据写入日志。"],["在问号处暂停推演","对 \"2, nope\"，第一轮 total 加 2；第二轮 parse 返回 Err，? 立即结束 sum_csv，根本不会继续执行 Ok(total)。调用者看到的是整个操作失败，而不是不完整的求和结果。要提供部分成功结果，需要另外设计数据结构和语义。"],["给错误添加上下文","解析第 20 行失败时，只有“invalid digit”还不够。可以定义 InvalidRecord { line, source }，在读取边界记录行号，在最外层打印说明。不要把带密码的整条配置或请求原样写入错误消息。"],["本章验收","能区分可恢复错误与内部 panic；把两个不同底层错误映射成应用 enum；解释 From 与 ? 的关系；严格解析时不静默过滤坏记录。"]],"code":"use std::num::ParseIntError;\nfn sum_csv(line: &str) -> Result\u003ci32, ParseIntError> {\n    let mut total = 0;\n    for part in line.split(',') {\n        total += part.trim().parse::\u003ci32>()?;\n    }\n    Ok(total)\n}\nfn main() {\n    println!(\"{:?}\", sum_csv(\"2, 3, 4\"));\n    assert!(sum_csv(\"2, nope\").is_err());\n    // 教学范围：小整数；任意输入还需处理求和溢出。\n}","output":"Ok(9)","pitfall":"用 filter_map(Result::ok) 解析数据会悄悄丢弃错误项。只有业务明确允许忽略坏记录时才这样做。","task":"实现 ex04：把逗号分隔的非空字段全部解析成 i32，返回 Result\u003cVec\u003ci32>, ParseIntError>；任一字段错误就整体失败。","hint":"迭代器生成 Result\u003ci32, _> 后，可 collect 到 Result\u003cVec\u003c_>, _>。空字符串也应视为错误。","answer":"line.split(',').map(|s| s.trim().parse::\u003ci32>()).collect()。collect 的 Result 实现会在遇到首个 Err 时返回错误。","quiz":[["Result 函数里的 ? 遇到 Err 会？",["跳过当前循环","从当前函数提前返回错误","自动重试"],1,"? 是错误传播，不是异常捕获或重试。"],["严格导入记录时 filter_map(Result::ok) 的风险是？",["静默丢失坏记录","一定 panic","不能编译"],0,"数据丢弃是业务选择，不应作为掩盖解析失败的默认方案。"]],"source":"https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html"},{"id":"10","phase":2,"title":"Vec、HashMap 与集合选型","subtitle":"先选择访问模式，再选择容器。","sections":[["Vec 的长度与容量","Vec\u003cT> 连续存储同类型元素，len 是已初始化元素个数，capacity 是无需重新分配时可容纳的数量。with_capacity 不会创建元素。get 返回 Option\u003c&T>；下标越界会 panic。remove 保持剩余顺序但移动后续元素；swap_remove 更快地删除末项以外的元素，但改变顺序。"],["映射、集合与排序","HashMap 提供键值查找，要求键实现 Eq + Hash，不能依赖迭代顺序。BTreeMap 按键有序，键要求 Ord；需要确定性输出时它往往更方便。HashSet 表达唯一性，BTreeSet 同时有序。VecDeque 适合两端队列，BinaryHeap 适合优先级任务。"],["entry 避免重复查找","entry(key).or_insert(default) 返回值的可变引用，适合计数与聚合；or_insert_with 只在缺失时构造值。调用 entry 需要拥有键，所以可能移动 String。HashMap\u003cString, V> 往往可用 &str 查找，无需为查找临时分配 String。"],["词频为什么使用 entry","第一次遇到 rust，entry 找不到已有值，插入 0 并借出 &mut u32；解引用后加 1。再次遇到 rust 时直接借出原值，再加 1。BTreeMap 按键排列，因此 Debug 输出顺序可预测，适合这个演示。"],["对比三个删除策略","Vec::remove 保持剩余顺序；swap_remove 牺牲顺序换取更少元素移动；retain 适合一次按谓词删除多个元素。删除时若仍保留元素引用，必须重新检查借用与失效条件。按任务需求选择，而不是只比较某一个操作的复杂度。"],["本章验收","能解释 len 与 capacity；词频支持空输入；知道 HashMap 不保证顺序；能为队列、去重和优先级各选择一个容器。"]],"code":"use std::collections::BTreeMap;\nfn main() {\n    let mut counts = BTreeMap::new();\n    for word in \"rust borrow rust\".split_whitespace() {\n        *counts.entry(word).or_insert(0_u32) += 1;\n    }\n    println!(\"{counts:?}\");\n    let mut values = Vec::with_capacity(8);\n    assert!(values.is_empty());\n    values.extend([10, 20, 30]);\n    assert_eq!(values.get(9), None);\n    println!(\"{}\", values.remove(1));\n}","output":"{\"borrow\": 1, \"rust\": 2}\n20","pitfall":"不能用 HashMap 的一次观察到的输出顺序作为测试预期。先排序、使用 BTreeMap，或按键验证。","task":"实现 ex05：忽略大小写，按空白分词，返回 BTreeMap\u003cString, usize> 词频。暂不去除标点，不进行 Unicode 正规化。","hint":"每个单词 to_lowercase，再 entry 累加。测试 \"Rust rust RUST\" 和空输入。","answer":"let mut result = BTreeMap::new(); for word in text.split_whitespace() { *result.entry(word.to_lowercase()).or_insert(0) += 1; } result。清楚定义分词规则比“看似智能”更重要。","quiz":[["Vec::with_capacity(10) 的 len 是？",["10","0","不确定"],1,"容量预留不创建元素。"],["需要稳定的按键顺序，优先选？",["HashMap","BTreeMap","随机打乱 Vec"],1,"BTreeMap 的迭代顺序由键的 Ord 决定。"]],"source":"https://doc.rust-lang.org/std/collections/index.html"},{"id":"11","phase":2,"title":"迭代器与惰性流水线","subtitle":"从元素类型推导整条处理链。","sections":[["三种遍历，三种权限","对 Vec\u003cT>，iter() 产出 &T，iter_mut() 产出 &mut T，into_iter() 按值消费容器并产出 T。对引用调用 IntoIterator 又会有对应的借用行为，因此不要只记住方法名字，要看接收者类型。for 循环本质上通过 IntoIterator 获取迭代器并不断调用 next。"],["适配器与消费者","map、filter、take、skip、zip 等通常是惰性适配器，构造链不等于执行。collect、sum、fold、for_each、find 等会消费迭代器，但不一定遍历全部元素：find、any、all 可以短路。Iterator::next 返回 Option\u003cSelf::Item>，None 表示当前结束。"],["引用层数要按签名判断","filter 的谓词接收 &Self::Item。若前面 iter() 的 Item 为 &i32，谓词看到的可能是 &&i32；copied 把 Copy 元素从引用转成值，cloned 显式克隆元素。collect 的目标类型决定最终结果，可以是 Vec、String、Result\u003cVec\u003c_>, _> 等。"],["可读性优先于链长度","适合表达数据变换时使用流水线；复杂状态更新和多条错误路径可以保留 for。避免每一步都 collect 造成中间分配；如果只求总和，直接 sum。不要为了所谓函数式风格把简单逻辑变成难以定位错误的嵌套闭包。"],["把流水线每一步的类型写出来","values.iter() 的元素是 &i32；copied() 后是 i32；filter 的谓词借用这个 i32；map 生成平方值；collect::\u003cVec\u003ci32>>() 真正消费整个链。sum 又借用 selected，所以最后 values 和 selected 都没有被前面的读取操作消耗。"],["查找不需要 collect","如果只要第一个匹配项，find 就可以短路；如果只问有没有，使用 any；若只求总和，直接 sum。先 collect 成大 Vec 再取一个值可能产生不必要工作。只有需要多次访问结果时才保留中间集合。"],["本章验收","能说出 iter/iter_mut/into_iter 的 Item；解释双重引用；写出 Result 的 collect；能识别未消费适配器里的副作用不会执行。"]],"code":"fn main() {\n    let values = vec![1, 2, 3, 4, 5];\n    let selected: Vec\u003ci32> = values.iter().copied()\n        .filter(|x| x % 2 == 0).map(|x| x * x).collect();\n    let total: i32 = selected.iter().sum();\n    println!(\"{selected:?} {total}\");\n    assert_eq!(values.len(), 5); // 只借用了 values\n    let parsed: Result\u003cVec\u003ci32>, _> = [\"10\", \"20\"].into_iter()\n        .map(str::parse::\u003ci32>).collect();\n    assert_eq!(parsed.unwrap(), vec![10, 20]);\n}","output":"[4, 16] 20","pitfall":"map 里写副作用却不消费迭代器，副作用不会执行。需要副作用循环可使用 for 或 for_each。","task":"实现 ex06：返回输入切片中所有偶数的平方和，结果使用 i64，覆盖空切片和负数。","hint":"先转为 i64 再平方；本题假设总和可放入 i64，不能先用 i32 相乘再转换。","answer":"values.iter().copied().filter(|n| n % 2 == 0).map(|n| { let n = i64::from(n); n * n }).sum()。生产 API 若接受任意长度，应明确总和溢出的策略。","quiz":[["iter() 之后 filter 闭包的入参可能是 &&T，因为？",["filter 再借用 Item","Rust 随机加引用","iter 会复制容器"],0,"filter 接收 &Self::Item，而 iter 的 Item 本身已是引用。"],["map 已构造但没人消费，通常？",["立即执行","延迟执行","自动启动线程"],1,"惰性适配器需要消费者拉取元素。"]],"source":"https://doc.rust-lang.org/std/iter/trait.Iterator.html"},{"id":"12","phase":2,"title":"闭包与 Fn 家族","subtitle":"区分捕获方式和调用能力。","sections":[["闭包可以捕获环境","函数项不能隐式捕获局部变量，闭包可以。编译器按闭包使用方式推断捕获：共享借用、可变借用、按值移动。move 强制捕获时按值取得环境，但被捕获的是引用时，移动的是引用本身，不会复制它指向的对象。"],["三个 trait 是能力集合","FnOnce 的 call_once 消费闭包，可以调用至少一次；FnMut 可通过可变借用重复调用；Fn 可通过共享借用重复调用。实现 Fn 的闭包也实现 FnMut 和 FnOnce。闭包是否把捕获值移出决定它能否重复调用，而不仅仅看有没有 move 关键字。"],["API 约束写到刚好够用","只调用一次的回调通常可接受 FnOnce；需要更新内部计数并反复调用则接受 FnMut；无需修改捕获状态的多次调用可以接受 Fn。返回闭包时常用 impl Fn(...) -> ...，它隐藏具体的匿名类型。存放不同闭包可能需要 Box\u003cdyn Fn(...)>。"],["捕获和调用是两条独立轴","read 用 move 拿走 label 的所有权，但调用时只读取长度，所以能重复调用。bump 借用并修改 count，必须作为可变闭包调用；once 的回调把 value 移出闭包，只能通过消费式调用完成。观察行为比只看 move 关键字可靠。"],["返回闭包为何需要 move","counter 函数结束后，局部 n 的栈绑定已结束。若闭包只是借用它，返回会造成悬垂引用；move 让 n 成为闭包环境中的拥有值。FnMut 表达调用时要修改这个环境，与是否需要堆分配无关。"],["本章验收","分别构造 Fn、FnMut、仅 FnOnce 的闭包；解释为何 move 闭包仍可 Fn；独立实现两个互不干扰的计数器。"]],"code":"fn once\u003cF: FnOnce() -> String>(f: F) -> String { f() }\nfn main() {\n    let label = String::from(\"Rust\");\n    let read = move || label.len();\n    println!(\"{} {}\", read(), read()); // move 闭包仍可重复调用\n    let mut count = 0;\n    {\n        let mut bump = || { count += 1; count };\n        assert_eq!(bump(), 1);\n        assert_eq!(bump(), 2);\n    }\n    let value = String::from(\"owned\");\n    println!(\"{} {count}\", once(|| value));\n}","output":"4 4\nowned 2","pitfall":"move 闭包并不必然只实现 FnOnce；只有把捕获的非 Copy 值移出闭包等行为，才会限制重复调用。","task":"实现 ex07：返回一个计数器闭包。起始值为 start，每次调用先加 1 再返回，返回类型是 impl FnMut() -> i32。","hint":"闭包必须拥有局部计数器，否则返回后引用会悬垂；用 move 捕获。","answer":"fn counter(start: i32) -> impl FnMut() -> i32 { let mut n = start; move || { n += 1; n } }。本练习限定调用过程中不发生 i32 溢出。","quiz":[["move || s.len() 能多次调用吗？",["一定不能","可以，若没有移出 s","只有 s 是 static"],1,"它拥有 s，但读取 len 不消耗 s。"],["重复修改捕获计数器需要？",["FnMut","只有 FnOnce","只能用裸指针"],0,"FnMut 允许通过 &mut self 更新闭包环境。"]],"source":"https://doc.rust-lang.org/book/ch13-01-closures.html"},{"id":"13","phase":2,"title":"泛型、约束与 const generics","subtitle":"抽象的是行为，不是“任意类型都能工作”。","sections":[["类型参数需要足够的能力","fn f\u003cT>(x: T) 并不表示可以对 x 做任意操作。比较需要 PartialOrd/Ord，复制需要 Clone/Copy，格式化需要 Display/Debug。where 子句在多个参数或复杂约束时更易读。优先借用返回结果，能避免给泛型加上不必要的 Clone 限制。"],["单态化与代码体积","普通泛型通常通过单态化为实际使用的类型生成专门实现，利于静态分派与优化，也可能增大编译时间和代码体积。impl Trait 在参数位置类似匿名泛型参数；在返回位置表示某一个具体但隐藏的类型，不是任意分支都能返回不同类型。"],["常量也是参数","const N: usize 可以把数组长度纳入类型。const generics 适合固定维度或固定缓冲区，不等于可以在所有类型位置使用任意运行时表达式。泛型 T 默认有 Sized 约束；T: ?Sized 放宽它，常用于通过引用接收 str、[T] 或 trait object。"],["为什么 largest 不要求 Clone","items.iter().max() 比较的是被借用的元素，最终把最大项的引用交给调用者。所有元素仍属于输入容器，既不复制 String，也不创建新的拥有者。空切片返回 None，让调用者明确处理没有最大值的情况。"],["从签名推导必要约束","如果函数需要打印，加入 Display 或 Debug；如果只比较，不要顺手添加 Clone、Copy 和 Default。每多一个约束都会排除一些原本可以合法工作的类型。用一个故意不实现 Clone 的测试类型验证你的接口没有过度约束。"],["本章验收","能写 where 子句；使用 const N 参数接收数组；区分 Ord 与 PartialOrd；解释 impl Trait 的返回类型为何必须一致。"]],"code":"fn largest\u003cT: Ord>(items: &[T]) -> Option\u003c&T> { items.iter().max() }\nfn sum_array\u003cconst N: usize>(values: [i32; N]) -> i32 {\n    values.into_iter().sum()\n}\nfn main() {\n    let names = [String::from(\"apple\"), String::from(\"pear\")];\n    println!(\"{}\", largest(&names).unwrap());\n    assert_eq!(largest::\u003ci32>(&[]), None);\n    println!(\"{}\", sum_array([1, 2, 3]));\n}","output":"pear\n6","pitfall":"Ord 是全序，浮点数因为 NaN 等原因通常只实现 PartialOrd。不要不解释业务语义就强行 unwrap partial_cmp。","task":"实现 ex08：generic_max\u003cT: Ord>(&[T]) -> Option\u003c&T>，不要求 Clone，空输入返回 None。","hint":"iter().max() 返回对原元素的借用。","answer":"items.iter().max()。返回引用会关联输入的生命周期；函数不会为“最大值”创建独立副本。","quiz":[["返回 impl Trait 的两个分支能随意返回不同具体类型吗？",["可以","通常不可以","必须用 unsafe 才行"],1,"返回位置的 impl Trait 代表一个固定的隐藏具体类型。"],["泛型最大值仅返回借用，必须约束 Clone 吗？",["必须","不需要","必须 Copy"],1,"比较和返回引用不需要复制元素。"]],"source":"https://doc.rust-lang.org/book/ch10-01-syntax.html"},{"id":"14","phase":2,"title":"Trait、关联类型与动态分派","subtitle":"把行为契约与具体存储分开。","sections":[["trait 是行为契约","trait 可以定义必需方法、默认方法和关联类型。impl Trait for Type 为类型提供能力。trait 不是类继承层次；默认方法可以复用行为，但没有传统继承的字段机制。孤儿规则限制跨 crate 实现，以维护一致性；常见办法是为外部类型建立本地 newtype 包装。"],["关联类型与泛型参数","Iterator::Item 由具体 Iterator 实现确定，调用者无需每次选它。trait 的泛型参数则允许同一类型针对不同参数有不同实现，在规则允许的情况下表达多种关系。不要把两者当成仅语法不同，它们影响约束的唯一性与 API 使用方式。"],["静态分派与 dyn","泛型 T: Trait 通常静态分派；&dyn Trait 或 Box\u003cdyn Trait> 使用动态分派，可在一个集合中存放不同具体类型。dyn 的代价包括间接调用和相关优化限制；Box 还涉及拥有与分配，但 &dyn 本身不意味着新分配。只有满足 dyn compatibility 的 trait 才能构造 trait object，例如可分派方法不能随意带类型泛型参数。"],["看见 trait object 的必要性","Note 与 Score 的大小和字段不同，普通 Vec\u003cT> 不能直接混放。Box\u003cdyn Summary> 把拥有的具体对象放在间接存储中，并通过统一行为接口调用 summary。这里既有动态分派，也有 Box 所需的分配，两者不要混为同一个成本。"],["新类型解决外部实现限制","想给外部库类型实现另一个外部 trait 时，通常受到孤儿规则约束。定义本地包装 struct MyType(ExternalType)，再为包装实现行为，并明确是否暴露 Deref。包装不是免费继承，需要决定外部 API 哪些能力应该继续可见。"],["本章验收","解释关联类型为什么由实现决定；能选择 enum、泛型或 dyn；了解 dyn compatibility；能用 newtype 建立本地行为入口。"]],"code":"trait Summary { fn summary(&self) -> String; }\nstruct Note(String);\nstruct Score(u32);\nimpl Summary for Note { fn summary(&self) -> String { self.0.clone() } }\nimpl Summary for Score { fn summary(&self) -> String { format!(\"score={}\", self.0) } }\nfn show(item: &impl Summary) { println!(\"{}\", item.summary()); }\nfn main() {\n    show(&Score(90));\n    let items: Vec\u003cBox\u003cdyn Summary>> = vec![\n        Box::new(Note(\"borrow\".into())), Box::new(Score(100))\n    ];\n    for item in items { println!(\"{}\", item.summary()); }\n}","output":"score=90\nborrow\nscore=100","pitfall":"dyn Trait 不是自动更灵活的默认答案；类型集合封闭时 enum 往往更直接。先看是否真的需要运行时异构。","task":"给 Summary 增加默认方法 is_empty，复用 summary；比较它和直接提供 &str 接口的分配成本。","hint":"默认方法可以调用 trait 中其他方法，但 summary 当前返回 String。","answer":"fn is_empty(&self) -> bool { self.summary().is_empty() }。此设计可能为检查空值分配字符串；正式 API 可把 is_empty 作为专门的无分配操作，而不是盲目复用。","quiz":[["Vec\u003cBox\u003cdyn Summary>> 的主要能力是？",["存放不同具体实现","让任何 trait 都对象安全","保证零分配"],0,"通过共同 trait object 接口容纳异构值。"],["Iterator::Item 属于？",["关联类型","运行时字符串","全局变量"],0,"它由 Iterator 的具体实现确定。"]],"source":"https://doc.rust-lang.org/book/ch18-02-trait-objects.html"},{"id":"15","phase":2,"title":"生命周期与借用 API","subtitle":"生命周期标注描述关系，不延长生命。","sections":[["编译器需要知道引用来自哪里","返回一个输入的切片时，输出有效期必须受输入限制。如果函数接受多个引用且可能返回其中任一个，签名需要表达共同约束。写同一个 'a 不要求两个实参原本存活完全一样久，而是让调用时选取满足约束的有效区域。"],["先尝试省略规则","每个输入引用先获得独立的省略生命周期；只有一个输入生命周期时，输出引用通常关联它；方法有 &self 或 &mut self 时，输出引用通常关联接收者。无法推导时才显式标注。结构体保存借用要带生命周期参数，拥有 String 则通常不需要。"],["static 的两个常见含义","&'static str 是整个程序期间有效的字符串借用；T: 'static 表示 T 不包含比 static 更短的借用约束，并不表示 T 必须一直活到程序结束。拥有 String 的值可以满足 T: 'static，仍会在正常作用域结束时释放。别用泄漏内存来“修复”借用错误。"],["选择拥有还是借用","短期视图适合借用；跨线程、队列、长期存储经常适合拥有数据。返回局部 String 的 &str 不合法，因为函数结束就释放了它；应返回 String，或返回真正来自输入的切片。生命周期复杂到难以维护时，检查数据结构是不是过度借用。"],["把有效区域画成时间线","a 和 b 都在 main 中存活，longer 返回其中一段借用；Excerpt 保存借用而不复制文本。若 b 改在更短的内层作用域创建，并把返回结果拿到外层使用，即使某次运行实际返回 a，也必须遵守签名承诺的共同生命周期关系。"],["为什么加 static 不会奏效","函数内创建 String 后返回 &local，无论把输出写成 &str、&'a str 还是 &'static str，都无法让 local 自动存活。真正可行的修复是返回 String，或把拥有的数据放到调用者提供的存储中。"],["本章验收","能对比输出来自单个输入和多个输入的签名；解释省略规则；能区分 &'static T 与 T: 'static；独立修复一个返回临时引用的错误。"]],"code":"fn longer\u003c'a>(a: &'a str, b: &'a str) -> &'a str {\n    if a.len() >= b.len() { a } else { b }\n}\nstruct Excerpt\u003c'a> { text: &'a str }\nimpl Excerpt\u003c'_> { fn text(&self) -> &str { self.text } }\nfn main() {\n    let a = String::from(\"ownership\");\n    let b = String::from(\"borrow\");\n    let excerpt = Excerpt { text: longer(&a, &b) };\n    println!(\"{}\", excerpt.text());\n}","output":"ownership","pitfall":"写上 'a 或 'static 不会改变实际资源的释放时机。返回局部变量引用的问题不能靠多写生命周期解决。","task":"实现 ex09：longer 按 UTF-8 字节长度返回两个输入中更长者，长度相等返回第一个，零分配。","hint":"两个输入和输出写同一个生命周期参数。这里比较字节长度是题目明确指定的规则。","answer":"fn longer\u003c'a>(a: &'a str, b: &'a str) -> &'a str { if a.len() >= b.len() { a } else { b } }。返回值只在两个输入都满足约束的区域内可用。","quiz":[["生命周期标注的作用是？",["延长值的存活","描述引用有效性的关系","自动 clone"],1,"它是编译期约束，不是运行时资源管理操作。"],["String 能满足 T: static 吗？",["能，因为它拥有数据","不能，它会释放","只有泄漏后才行"],0,"类型的 static 约束不意味着该值永不析构。"]],"source":"https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html"},{"id":"16","phase":2,"title":"模块、crate、package 与可见性","subtitle":"让依赖方向清楚，而不是文件越拆越多。","sections":[["四个层次","package 由 Cargo.toml 定义，可以含一个库 target 和多个二进制 target；crate 是编译单元，通常有一个根；module 组织 crate 内命名空间；use 把路径引入当前作用域。mod 声明模块，use 不会自动加载任意磁盘文件。"],["文件映射与路径","src/lib.rs 是库根，src/main.rs 是默认二进制根；src/bin/name.rs 可以成为额外二进制。mod storage; 通常对应 storage.rs 或 storage/mod.rs，选一种组织方式。crate:: 从当前 crate 根出发，super:: 指向父模块，self:: 指向当前模块。"],["收窄公开接口","pub 暴露 API，pub(crate) 限制在 crate 内，pub(super) 限制在父级可见范围。结构体本身公开不代表所有字段都公开；enum 的公开变体规则不同。pub use 可重导出稳定入口，把内部文件布局与外部 API 分开。"],["综合项目采用的边界","把解析与业务规则放进库，让 main 只处理参数、终端和退出码。存储层返回数据与错误，不直接 println；展示层决定文本格式。单向依赖能让业务测试不需要启动终端或访问真实用户目录。"],["从文件树走到名字解析","domain 中 Topic 是公开结构体，name 字段仍私有；impl 中的 new 和 name 明确公开。外部通过 use domain::Topic 获得短名字，构造和读取都经过公开方法。拆成文件后模块关系保持不变，文件名只是模块树的承载方式。"],["避免 main.rs 塞满业务","把可以独立测试的领域函数放 lib.rs 或子模块；main.rs 只负责读取环境与参数、调用业务、决定输出和退出码。HTTP 入口和 CLI 可以使用同一个库，升级项目正是这样组织。"],["本章验收","能从包名判断库 crate 的使用路径；独立增加 src/bin 第二个二进制；解释 pub(crate) 和 pub use 的边界。"]],"code":"mod domain {\n    #[derive(Debug)]\n    pub struct Topic { name: String }\n    impl Topic {\n        pub fn new(name: &str) -> Self { Self { name: name.into() } }\n        pub fn name(&self) -> &str { &self.name }\n    }\n}\nuse domain::Topic;\nfn main() {\n    let topic = Topic::new(\"modules\");\n    println!(\"{}\", topic.name());\n    // topic.name 不可从这里直接读取：字段私有。\n}","output":"modules","pitfall":"main.rs 与 lib.rs 是同一个 package 中的不同 crate 根；二进制使用库时通常通过包名对应的 crate 名导入。","task":"把本章内联 domain 模块拆成 domain.rs，并解释 mod domain 与 use domain::Topic 的区别。","hint":"mod 建立模块树，use 缩短名字。文件应位于声明模块的对应目录。","answer":"main.rs 放 mod domain; use domain::Topic;；domain.rs 放 Topic 定义和实现。无需在 domain.rs 再包一层 mod domain，否则路径会多一层。","quiz":[["use storage::Store 会自动声明 storage 模块吗？",["会","不会","只有 release 会"],1,"需要 mod 声明或来自外部 crate 的路径。"],["希望仅 crate 内可见，使用？",["pub(crate)","pub 全部公开","static"],0,"显式限制可见性可以保留内部重构空间。"]],"source":"https://doc.rust-lang.org/book/ch07-02-defining-modules-to-control-scope-and-privacy.html"},{"id":"17","phase":2,"title":"测试、文档测试与调试","subtitle":"为行为写证据，为边界写反例。","sections":[["测试的三种尺度","单元测试常放在源文件里的 #[cfg(test)] mod tests 中，可访问父模块私有实现；集成测试放 tests/，从外部使用公开 API；文档中的 Rust 代码块可成为 doctest。把纯计算从 I/O 中分离，测试就能快速、确定、容易定位。"],["测试什么比测试数量重要","覆盖正常值、空值、最小最大值、错误输入、重复操作与状态变化。assert_eq! 用于具体预期；should_panic 只适合约定必须 panic 的 API，普通错误应断言 Result。不要只把实现重新写一遍当预期，应使用具体案例或独立的不变量。"],["运行和定位","cargo test 运行测试；cargo test name 过滤；-- --nocapture 展示输出；-- --test-threads=1 可辅助排查共享环境干扰。测试默认可并行，因此不要共享固定临时文件名或依赖测试执行顺序。dbg! 打印表达式和位置并返回原值，RUST_BACKTRACE=1 帮助分析 panic。"],["格式与静态分析","cargo fmt 统一格式，cargo clippy 提供更多静态建议，cargo doc 构建文档；三者都不能替代业务测试。修 Clippy 时理解建议的语义，别为消除提示而改变错误处理或偷偷丢弃数据。编译失败测试可通过 compile_fail 文档块明确记录某种误用不应编译。"],["测试必须能抓住真实错误","把 clamp 的 min/max 处理写反，边界断言应该失败。若测试只调用函数却不检查结果，它可能对错误实现依然绿灯。优先选择能区分正确实现与常见错误实现的输入，而不是单纯增加重复案例数。"],["测试数据需要隔离","每个文件测试用独立目录，不复用固定的 tasks.db；涉及时间时使用可控制的时钟或模拟时间；涉及并发输出时不要要求一个未定义的交错顺序。依赖运行顺序的测试会在 CI 中间歇失败。"],["本章验收","写出一个正常、一个边界、一个错误用例；能运行单项测试；说明集成测试与文档测试的区别；故意改坏实现并确认测试失败。"]],"code":"fn clamp(n: i32, min: i32, max: i32) -> i32 { n.max(min).min(max) }\nfn main() {\n    assert_eq!(clamp(-2, 0, 10), 0);\n    assert_eq!(clamp(5, 0, 10), 5);\n    assert_eq!(clamp(20, 0, 10), 10);\n    println!(\"3 boundary checks passed\");\n}\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn boundaries() {\n        assert_eq!(clamp(0, 0, 10), 0);\n        assert_eq!(clamp(10, 0, 10), 10);\n    }\n}","output":"3 boundary checks passed","pitfall":"本章 clamp 示例假设 min \u003c= max。正式 API 应决定非法区间是 Result、panic 还是另一个契约，并测试它。","task":"为 ex03 补充至少五个独立案例：空串、全空白、中文、前导空白、多行。然后执行 cargo test ex03。","hint":"测试里直接比较 Option\u003c&str>；None 的类型可由函数返回值推导。","answer":"断言 first_word(\"\")==None，first_word(\" \\t\")==None，first_word(\"你好 Rust\")==Some(\"你好\")，first_word(\"  rust\")==Some(\"rust\")，first_word(\"\\nrust\\nlang\")==Some(\"rust\")。","quiz":[["集成测试主要使用？",["公开 API","任意私有字段","编辑器缓存"],0,"集成测试作为外部使用者检验公共契约。"],["多个测试共用固定文件名的风险？",["并行时互相干扰","测试必定更快","没有风险"],0,"应为测试分配独立临时目录或注入存储。"]],"source":"https://doc.rust-lang.org/book/ch11-03-test-organization.html"},{"id":"18","phase":3,"title":"Box、Rc、Weak 与内部可变性","subtitle":"按所有权关系选择指针，而不是背模板。","sections":[["Box 与递归类型","Box\u003cT> 拥有堆上的 T，自身具有已知大小，因此可用于打断递归类型的无限大小。Box 不提供共享所有权，也不天然提供并发能力。Deref 让指针包装可以借用目标；Drop 用于资源释放，RAII 不只管理内存，也管理锁、文件等资源。"],["Rc 与 Weak","Rc\u003cT> 为单线程提供引用计数共享所有权；clone 增加强引用计数，最后一个强引用释放时销毁 T。两个 Rc 强引用互相指向可形成环，导致资源不释放。Weak 不维持 T 存活，upgrade 返回 Option\u003cRc\u003cT>>，适合父指针、缓存和观察者。"],["内部可变性不是取消规则","Cell\u003cT> 适合通过替换或 Copy 取值更新简单数据；RefCell\u003cT> 在运行时检查借用。borrow_mut 与活跃 borrow 冲突会 panic，try_borrow_mut 可返回错误。Rc\u003cRefCell\u003cT>> 常用于单线程可变图结构，但不要因此跳过更简单的独占结构设计。"],["并发需要另一组类型","Rc 和 RefCell 不能直接用作跨线程共享可变数据方案。Arc 提供线程安全引用计数，但 T 的线程安全性仍然重要；可变访问通常需要 Mutex、RwLock 或原子类型。Arc\u003cRefCell\u003cT>> 并不会神奇地变成安全跨线程容器。"],["引用计数不是复制业务对象","other = Rc::clone(&data) 增加强引用，仍访问同一个 RefCell\u003cVec\u003c_>>。通过 other push 后，data 看到长度 2。最后两个 Rc 都 drop 后，Weak 无法升级；它没有替对象保留存活资格。"],["运行时借用冲突如何观察","先绑定 let guard = data.borrow()，再 try_borrow_mut 会失败，因为共享借用仍活跃。drop(guard) 之后再试成功。与编译期借用错误相比，RefCell 把一部分检查推迟到执行时，因此测试仍然很重要。"],["本章验收","能解释 Box、Rc、Arc、Weak 的拥有关系；能展示一次 RefCell 冲突；能识别强引用环；不会用 Arc\u003cRefCell\u003c_>> 伪装线程安全。"]],"code":"use std::cell::RefCell;\nuse std::rc::Rc;\nfn main() {\n    let data = Rc::new(RefCell::new(vec![\"ownership\"]));\n    let other = Rc::clone(&data);\n    other.borrow_mut().push(\"borrowing\");\n    println!(\"{} {}\", data.borrow().len(), Rc::strong_count(&data));\n    let weak = Rc::downgrade(&data);\n    drop(other);\n    drop(data);\n    assert!(weak.upgrade().is_none());\n    println!(\"released\");\n}","output":"2 2\nreleased","pitfall":"RefCell 的借用检查失败是运行时错误；它不是“允许两个可变引用同时有效”的许可证。","task":"构造 Rc\u003cRefCell\u003cVec\u003ci32>>>，保留一个 borrow()，再调用 try_borrow_mut()，验证得到 Err；释放前者后再试。","hint":"把 Ref 绑定在变量里，再 drop(guard)，明确结束借用。","answer":"let guard = data.borrow(); assert!(data.try_borrow_mut().is_err()); drop(guard); assert!(data.try_borrow_mut().is_ok());。不要用 borrow_mut 触发 panic 来表达可恢复冲突。","quiz":[["Weak 的主要作用？",["不延长对象存活的引用","让对象永不释放","自动互斥"],0,"upgrade 明确处理对象可能已经释放的情况。"],["Arc\u003cRefCell\u003cT>> 自动支持跨线程共享吗？",["支持","不支持","仅 Windows 支持"],1,"Arc 只处理引用计数原子性，内部类型仍需满足对应 Send/Sync 条件。"]],"source":"https://doc.rust-lang.org/book/ch15-05-interior-mutability.html"},{"id":"19","phase":3,"title":"线程、Send、Sync 与作用域线程","subtitle":"并发安全从数据边界开始。","sections":[["线程拥有独立执行进度","thread::spawn 启动操作系统线程，返回 JoinHandle。join 等待完成并返回线程结果或 panic 信息。主线程退出可能终止仍运行的其他线程，因此需要明确 join 或应用生命周期。move 常用于把拥有的数据移入线程闭包。"],["Send 与 Sync 的含义","Send 表示值可以在线程间转移；Sync 表示共享引用 &T 可以在线程间转移，等价地关联 &T: Send。它们通常由成员类型自动推导。不要自行 unsafe impl 来消除报错，除非能够证明同步与别名不变量。内存安全也不等于没有死锁或业务竞态。"],["为什么 spawn 要 static","普通 spawn 的闭包可能比调用函数活得更久，所以捕获的借用不能指向即将销毁的局部数据。thread::scope 保证子线程在作用域退出前结束，允许借用作用域内的数据。对有限批次的并行任务，它可以避免不必要的 Arc 或 clone。"],["scope 把结束条件变成结构","两个子线程借用 values 的不同只读区间，JoinHandle 返回各自的和。scope 退出前会确保作用域线程结束，所以 values 不会在线程仍读取时被销毁。普通 spawn 没有这个词法范围保证，不能同样借用短命局部值。"],["并发不总是性能优化","四个数字分到两个线程只是机制演示，线程开销可能远大于求和成本。把数据规模加大后再测量，或者使用已有线程池。正确拆分、明确数据归属、合理处理 join 错误，是先于性能的步骤。"],["本章验收","能解释 Send/Sync；选择 scope 或拥有值的 spawn；不依赖输出先后验证并发；测试空切片与奇数长度切片。"]],"code":"use std::thread;\nfn main() {\n    let values = [1_i32, 2, 3, 4];\n    let total = thread::scope(|scope| {\n        let left = scope.spawn(|| values[..2].iter().sum::\u003ci32>());\n        let right = scope.spawn(|| values[2..].iter().sum::\u003ci32>());\n        left.join().unwrap() + right.join().unwrap()\n    });\n    println!(\"{total}\");\n}","output":"10","pitfall":"spawn 两个线程不保证比单线程快。线程创建、同步和数据搬运有成本，短任务应先测量。","task":"实现 ex10：把 &[i32] 拆成两半，通过 thread::scope 分别求 i64 和，最后合并；空输入也应返回 0。","hint":"split_at(len / 2)；线程闭包只读借用两段切片，join 后求和。","answer":"使用 thread::scope，在两个 scope.spawn 闭包中 iter().map(|&x| i64::from(x)).sum::\u003ci64>()。对 join 的错误策略需明确；练习按内部不变量使用 expect。","quiz":[["Send 表达？",["值可在线程间转移","一定是 Copy","自动加锁"],0,"Send 是线程转移能力，不是复制或同步操作。"],["scope 允许借用局部数据，因为？",["保证作用域结束前线程结束","延长所有数据到 static","关闭借用检查"],0,"结构化生命周期让编译器能证明借用有效。"]],"source":"https://doc.rust-lang.org/std/thread/fn.scope.html"},{"id":"20","phase":3,"title":"Mutex、Channel 与原子操作","subtitle":"选一种状态协调方式，并明确退出条件。","sections":[["共享内存与消息传递","Arc\u003cMutex\u003cT>> 允许多个线程共享一个由互斥锁保护的值；锁的 guard 在 Drop 时释放。通道把数据所有权交给接收端，减少共享状态；std::sync::mpsc 是多生产者、单消费者。sync_channel 的有界容量可以施加背压，避免无限堆积消息。"],["锁的正确使用方式","临界区尽量短，不在持锁时做慢 I/O 或调用未知回调。多个锁要有一致的获取顺序。标准 Mutex 的锁中毒意味着某个线程可能在持锁时 panic，需要决定状态是否仍可恢复；不要把所有 PoisonError 都静默忽略。死锁和高层逻辑竞态仍可能出现在完全 safe 的 Rust 程序中。"],["通道关闭与退出","接收端迭代会等待，直到所有发送端都被丢弃。若主线程忘记 drop 原始 sender，即使所有工作线程结束，接收循环也可能一直等。关闭协议应区分正常完成、错误中止与取消。原子类型适合简单独立计数或标志；Relaxed 不提供跨位置的同步顺序，不能随意替代 Mutex。"],["理解通道为什么能结束","示例把唯一 tx 移入工作线程，线程发送完后 tx 被 drop；接收迭代器在缓冲消息读完且发送端全销毁后返回结束。若主线程偷偷保留一个 clone，即使它永远不发送，接收端也不会知道以后不再有消息。"],["锁住的内容越少越容易推理","加锁、读取或更新、释放 guard，再做慢操作。若需要多个锁，规定全局顺序；若状态转换跨多个字段，单个原子变量往往不能表达整体不变量。内存安全和业务状态正确是不同的检查层。"],["本章验收","能故意复现通道等待不结束并修复；解释有界队列背压；能画出锁顺序导致的死锁；了解 Relaxed 不能传递任意跨变量同步关系。"]],"code":"use std::sync::mpsc;\nuse std::thread;\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    let handle = thread::spawn(move || {\n        for n in [2, 4, 6] { tx.send(n).unwrap(); }\n    });\n    let total: i32 = rx.into_iter().sum();\n    handle.join().unwrap();\n    println!(\"{total}\");\n}","output":"12","pitfall":"通道等待不是“自动知道没有任务了”。它观察的是发送端存活情况或显式协议。","task":"把示例改成两个生产线程，各发送三个值。保留句柄并 join，收集结果后排序以消除调度顺序差异。","hint":"克隆 sender 后，把主线程原始 sender 丢弃，再进入接收迭代。","answer":"创建 tx1 = tx.clone()，分别 move 进两个线程；drop(tx) 或把原始 tx 移进其中一个线程。接收结果排序后比较集合内容，不断言线程消息的交错顺序。","quiz":[["所有工作线程已结束，但 rx 仍等待，可能因为？",["主线程仍持有 sender","Rust 不支持通道","少写一个 clone"],0,"所有 sender 必须销毁或按协议发结束消息。"],["safe Rust 能完全防止死锁吗？",["能","不能","只在 debug 能"],1,"类型系统防止某类内存错误，不保证业务级活性。"]],"source":"https://doc.rust-lang.org/book/ch16-02-message-passing.html"},{"id":"21","phase":3,"title":"async、await 与 Future","subtitle":"异步是可暂停的计算，不等于自动并行。","sections":[["调用 async fn 会得到 Future","async fn 的调用先构造 Future，函数体通常在 future 被 poll 时推进。await 等待另一个 Future；当它尚未就绪时，当前任务可以把执行机会让给其他任务。普通同步函数里不能直接 await。两个连续的 await 默认先后等待，不会自动把两个任务同时调度。"],["语言与运行时分工","语言提供 async/await 与 Future 抽象，标准库提供 Poll、Context、Waker 等基础接口；网络事件循环、计时器、任务调度通常来自 Tokio 等运行时。Future::poll 返回 Ready(value) 或 Pending；Pending 时必须安排在进展可能发生后唤醒任务。不能无条件忙循环 poll，下面例子只轮询明确立即就绪的 Future。"],["取消、阻塞与任务边界","丢弃 Future 通常意味着不再继续轮询，但已经发生的副作用不会回滚，已启动的外部操作也不一定取消。async 块中调用 std::thread::sleep 会阻塞工作线程；慢 CPU 工作或阻塞库需要明确移出异步调度线程。spawn 的任务拥有独立生命周期，必须考虑 join、取消和错误传播。"],["一个实用判断","等待大量 I/O 时异步可能有效；纯 CPU 运算并不会因为 async 变快。先写正确的同步业务内核，再在边界引入异步 I/O。不要为了套用 async 而把每个函数都改成 async，也不要持有不适合跨 await 的锁 guard。"],["对 Future 做一次显式 poll","double(21) 本身产生 Future；外层 async 块把它 await。示例里没有真实 I/O 或计时器，所以第一次 poll 直接得到 Ready(42)。Waker::noop 仅因为这个前提才足够，若替换成网络等待，演示驱动器就不再正确。"],["spawn_blocking 的取消边界","同步 SQLite 操作必须离开 executor 工作线程。spawn_blocking 一旦开始执行，通常不能靠 abort 强行中止；外层请求取消也不等于 SQL 回滚。升级项目让并发许可随真正的阻塞工作一起释放，避免客户端离开后提前放开资源限制。"],["本章验收","能解释 Future、poll、Pending、Waker 的关系；识别顺序 await；会选择 async I/O 与阻塞任务边界；不把请求超时当作事务撤销。"]],"code":"use std::future::Future;\nuse std::task::{Context, Poll, Waker};\nasync fn double(n: i32) -> i32 { n * 2 }\nfn main() {\n    let mut future = Box::pin(async { double(21).await });\n    let mut context = Context::from_waker(Waker::noop());\n    match future.as_mut().poll(&mut context) {\n        Poll::Ready(value) => println!(\"{value}\"),\n        Poll::Pending => panic!(\"本例不包含真正挂起的操作\"),\n    }\n}","output":"42","pitfall":"此例是 Future 机制演示，不是通用 executor。真实网络或定时器 Future 需要可唤醒的调度器和对应运行时。","task":"把两个 double 调用放进同一个 async 块，并说明先后 await 与并发调度的区别。完成后阅读附带 tokio-lab 的超时与取消示例。","hint":"即使 Future 很快完成，语义仍然是先完成第一个 await 再执行后面的表达式。","answer":"let a = double(10).await; let b = double(20).await; a + b。它们顺序完成；Tokio 的 join! 可以并发轮询多个 Future，但并发轮询本身不意味着两个 CPU 核同时执行。","quiz":[["调用 async fn 后，函数体一定已经运行完吗？",["是","否，得到一个 Future","自动新建线程"],1,"Future 的执行依赖被轮询。"],["async 任务中 thread::sleep 的影响？",["只暂停当前 Future","阻塞执行它的线程","自动转为 Tokio timer"],1,"阻塞操作不会因为处于 async 块中就自动异步化。"]],"source":"https://doc.rust-lang.org/book/ch17-01-futures-and-syntax.html"},{"id":"22","phase":3,"title":"Pin、Unpin 与异步工程","subtitle":"理解保证的边界，比背类型签名更重要。","sections":[["为什么需要 Pin","有些类型的正确性依赖值的地址保持稳定，例如含内部指向自身数据关系的状态机。Pin\u003cP> 在相应契约下限制被指向值的移动；被固定的是 pointee，而不是要求指针包装本身永远不能移动。Box::pin 可以在堆上固定值。Pin 不会自动解决别名、线程安全或初始化问题。"],["Unpin 表达什么","多数普通类型实现 Unpin，表示它们不依赖固定地址保证，可以从固定引用安全获取普通可变访问。某些 async 状态机可能是 !Unpin。调用 Future::poll 需要 Pin\u003c&mut Self>；使用运行时和高级组合器时，通常不必手写 unsafe pin 投影。"],["异步锁、超时与取消","标准 Mutex 的 guard 不宜跨 await；优先在 await 前完成短临界区，或在必要时使用异步锁。timeout 包装等待过程，超时后应明确重试是否会重复副作用。select! 选出先完成分支，但要检查另一个分支被取消时是否丢失部分读写进度。网络协议应设计幂等键、帧边界与有界缓冲。"],["spawn 所需的 Send 与 static","多线程 executor 可能在线程间移动任务，所以 spawn 往往要求 Future: Send + 'static。真正需要跨 await 保存的局部状态会进入 Future；如果其中含不满足 Send 的值，任务就无法在这些调度器上 spawn。解决方向是缩短其作用域、改变数据所有权，或使用适当的本地任务机制，而不是盲目增加 Arc。"],["固定的是目标，移动的是句柄","Box::pin 分配并固定 String 对象，Pin::as_mut 产生固定可变引用。String 实现 Unpin，所以可以 get_mut 进行普通可变访问；随后把 pinned 交给 moved_handle 只移动了指针包装，并不搬动它指向的分配。"],["在 await 前结束短期 guard","把 MutexGuard 放进独立作用域，在里面完成字段读取并构造拥有的结果，离开作用域后再 await。若确实需要异步等待锁，使用合适的异步 Mutex，并仍然评估是否真的必须把锁持有跨越 I/O。"],["本章验收","能解释 Pin 与 Unpin；知道 Pin 不是不可变性或线程安全；能从 spawn 的 Send 错误定位跨 await 保存的非 Send 值；能讨论超时后的幂等性。"]],"code":"use std::pin::Pin;\nfn main() {\n    let mut pinned = Box::pin(String::from(\"Rust\"));\n    // String: Unpin，因此这里可以获得普通 &mut String。\n    let text: &mut String = Pin::as_mut(&mut pinned).get_mut();\n    text.push_str(\" async\");\n    let moved_handle = pinned; // 移动 Box 句柄，不搬动它指向的分配\n    println!(\"{moved_handle}\");\n}","output":"Rust async","pitfall":"Pin 不是“把任何变量变得不可变”。它关注移动与地址相关契约，仍可能通过符合规则的 API 修改内容。","task":"在 tokio-lab 中先阅读任务、通道、超时三个测试；说明 timeout 超时为什么不等于数据库事务自动回滚。","hint":"区分停止等待、丢弃 Future、取消底层操作、撤销已经发生的副作用。","answer":"timeout 限制等待时长，无法通用地撤销已提交的写操作。业务需靠事务、幂等键或补偿逻辑提供更强语义。并发取消的正确性必须由具体 API 契约保证。","quiz":[["Pin\u003cBox\u003cT>> 固定的主要对象是？",["Box 句柄变量本身","指针指向的 T","所有关联全局变量"],1,"指针包装可以移动，固定的是 pointee 的相关地址保证。"],["超时必然撤销全部副作用吗？",["是","不是","仅 release 会"],1,"停止等待和业务回滚是不同层次的机制。"]],"source":"https://doc.rust-lang.org/std/pin/"},{"id":"23","phase":3,"title":"宏、属性与条件编译","subtitle":"需要语法抽象时，再走进宏系统。","sections":[["宏与普通函数不同","函数接收运行时值，宏处理 token 并在编译流程中展开成代码。println!、vec!、assert_eq! 是常见宏。优先用函数、泛型、trait 解决普通抽象；宏适合可变参数、代码生成或不能直接由函数表达的语法模式。"],["macro_rules 的匹配与重复","声明宏使用模式捕获，如 $name:ident、$value:expr、$ty:ty；$(... ),* 表示按分隔符重复，$(,)? 接受可选尾逗号。宏展开仍然必须通过普通类型检查和借用检查，宏不绕过语言规则。跨 crate 宏引用自身 crate 项时，$crate 有专门用途。"],["过程宏与 cfg","derive 宏、属性宏和函数式过程宏运行在编译时，通常位于 proc-macro crate，消费并生成 TokenStream；它们不是运行时反射。#[cfg(...)] 在条件不满足时移除代码，cfg!(...) 产生布尔值，但分支中的代码仍可能需要通过类型检查。feature 是包定义的条件选项，不应自动当作安全边界。"],["手工展开一次宏","labels![\"ownership\", 2024] 展开为 vec![\"ownership\".to_string(), 2024.to_string()]。每个参数在本宏里只出现一次，因此不会因为重复展开而重复求值。尾逗号规则让列表最后多一个逗号也能匹配。"],["区分代码移除与常量条件","if cfg!(target_os = \"windows\") 的另一个分支仍需要类型正确；#[cfg(target_os = \"windows\")] 可以让特定项只在 Windows 编译。跨平台调用不存在的系统 API 时，这个区别会直接影响能否构建。"],["本章验收","能解释 expr、ident 捕获；支持零项与尾逗号；检查参数求值次数；知道过程宏需要专用 crate，且展开后的代码仍受类型检查。"]],"code":"macro_rules! labels {\n    ($($value:expr),* $(,)?) => {\n        vec![$($value.to_string()),*]\n    };\n}\nfn main() {\n    let topics = labels![\"ownership\", \"borrow\", 2024,];\n    println!(\"{}\", topics.join(\" / \"));\n    assert!(cfg!(any(target_pointer_width = \"32\", target_pointer_width = \"64\")));\n}","output":"ownership / borrow / 2024","pitfall":"宏把参数表达式展开多次可能导致副作用重复执行。设计宏时明确求值次数，必要时先绑定局部变量。","task":"扩展 labels! 支持零个参数；观察类型推断是否需要标注 Vec\u003cString>。","hint":"重复次数 * 允许零个；但空 vec! 缺乏元素类型上下文。","answer":"let empty: Vec\u003cString> = labels![]; assert!(empty.is_empty());。语法允许零项不代表类型总能自动推导。","quiz":[["cfg!(...) 与 #[cfg(...)] 相同吗？",["相同","不同，前者是布尔表达式","前者只能运行时读取系统"],1,"条件属性会在对应编译条件下移除项或代码，cfg! 不等同于移除。"],["宏生成代码还要接受借用检查吗？",["要","不要","仅导出的宏需要"],0,"展开后的普通 Rust 代码仍受类型和借用规则约束。"]],"source":"https://doc.rust-lang.org/book/ch20-05-macros.html"},{"id":"24","phase":3,"title":"unsafe、裸指针与 FFI","subtitle":"把无法由编译器验证的证明缩到最小。","sections":[["unsafe 不会关闭所有检查","unsafe 允许执行若干额外操作，例如解引用裸指针、调用 unsafe 函数、访问某些可变静态状态等；普通类型和借用规则仍在。未定义行为在 unsafe 内外都不允许。一次运行结果看起来正常不代表代码 sound。"],["安全封装要证明什么","解引用前需要有效地址、正确对齐、已初始化且符合类型有效性的值，并遵守别名和生命周期要求。封装的安全函数必须确保任意合法 safe 调用者都无法触发 UB。写 SAFETY 注释解释具体前提为何成立，比只写“这里安全”更有价值。"],["FFI 是契约边界","extern \"C\" 使用 C ABI；#[repr(C)] 控制适合 C 互操作的布局，但不能自动让任意 Rust 类型成为安全 C 接口。String、Vec、trait object 不应直接当成 C 稳定布局对象。跨边界需要清楚规定分配与释放方、长度、编码、空指针、错误和 panic 策略；CString 可处理以 NUL 结尾的字符串需求。"],["2024 的显式 unsafe","edition 2024 对 unsafe fn 内部的 unsafe 操作默认提示显式 unsafe 块；extern 块与部分属性也有相应安全声明要求。unsafe fn 声明调用者必须满足额外条件，unsafe 块则表明作者在局部承担证明责任。Miri 可以帮助发现一部分 UB，但不能作为所有正确性的证明。"],["逐条核对 SAFETY","非空检查保证首元素存在；as_ptr 来自仍存活的切片，满足有效地址与对齐；i32 已初始化且可复制；代码只读，不构造冲突的可变引用。每个条件都应能从附近代码和函数参数契约推出，而不是依赖“测试时没崩”。"],["安全封装从外部看是否可误用","假设调用者只使用 safe Rust，能否提供某个合法输入触发越界或悬垂？如果能，封装就不 sound。减少 unsafe 区域，把前置检查放进安全 API，用清楚的文档声明 unsafe fn 的额外前提。"],["本章验收","把示例还原为 first().copied()；列出读指针的有效性前提；解释 repr(C) 不等于完整 FFI 安全；知道 Miri 的发现能力与证明边界。"]],"code":"fn first(values: &[i32]) -> Option\u003ci32> {\n    if values.is_empty() { return None; }\n    let ptr = values.as_ptr();\n    // SAFETY: 非空切片的首元素已初始化、对齐且在此调用期间存活；\n    // 只读取 Copy 值，不创建可变别名。\n    Some(unsafe { *ptr })\n}\nfn main() {\n    assert_eq!(first(&[]), None);\n    println!(\"{:?}\", first(&[7, 8]));\n    // 实际业务直接 values.first().copied() 更合适。\n}","output":"Some(7)","pitfall":"此处 unsafe 仅用于解释证明义务。实际代码有安全 API 时，应直接使用安全 API，不能把 unsafe 当性能捷径。","task":"把示例完全改写为 safe Rust；然后列出原始裸指针读取至少三个必须成立的前提。","hint":"切片 first 返回 Option\u003c&i32>，copied 转为 Option\u003ci32>。","answer":"values.first().copied()。原始实现需要非空保证、对齐、已初始化的 i32、有效生命周期和读取不违反别名约束；安全 API 封装了这些细节。","quiz":[["unsafe 块内 UB 是否允许？",["允许","不允许","debug 允许"],1,"unsafe 只是把证明责任交给程序员，不允许未定义行为。"],["repr(C) 能让 String 自动成为合适的 C 参数吗？",["能","不能","只要 clone 就行"],1,"布局、拥有权和 ABI 都必须按边界协议设计。"]],"source":"https://doc.rust-lang.org/reference/behavior-considered-undefined.html"},{"id":"25","phase":4,"title":"API 设计与常用 trait","subtitle":"让调用者容易做对，也容易处理失败。","sections":[["参数签名就是文档","只读文本优先 &str、只读序列优先 &[T]；确实存入结构体或转交线程时再接收 String/Vec。Into\u003cString> 让调用方便，但意味着可能分配和拥有；AsRef\u003cPath> 适合路径输入。不要把所有参数一律变成泛型，过多类型参数会增加错误消息复杂度。"],["转换与展示","From\u003cT> 表示约定上的不失败转换；TryFrom\u003cT> 表达可能失败。实现 From 后通常自动获得反向的 Into 便利。Display 面向稳定的用户展示，Debug 面向调试；FromStr 适合文本解析。Default 应是合理初始值，而不是随便挑一个状态以满足语法。"],["让非法状态难以构造","newtype、私有字段、返回 Result 的构造器能落实领域规则。Builder 适合可选参数较多的对象，build 阶段验证必需信息。typestate 用类型区分阶段，如 Draft 与 Published，能在编译期限制方法，但也会提高复杂度，适合确实重要的流程约束。"],["Cow 与借用优化","Cow\u003c'a, str> 可以在无需修改时借用、需要修改时拥有，适合正规化或转义接口。它不是所有字符串 API 的默认选择，只有借用路径常见且分配成本确实值得关心时才使用。稳定公共 API 的变更要考虑调用者兼容性和错误类型扩展。"],["两条返回路径的分配差异","normalize(\"rust\") 返回 Cow::Borrowed，仍借用调用者文本；normalize(\"rust_notes\") 才构造 Owned String。值相等的测试不够覆盖这种设计，需要额外 matches! 断言具体变体，否则偷偷全部分配的实现也能通过。"],["把类型转换与校验分开描述","From 用于不失败的转换；TryFrom 用于可能失败的校验转换。不要在 From 里对普通非法用户输入 panic。若构造字段复杂，Builder::build 也应返回 Result，并把错误定位到具体缺失或冲突的选项。"],["本章验收","写出合适的只读和拥有参数；设计一个 newtype；实现 Display 与 TryFrom；能根据实际分配路径选择 Cow，而不是到处套泛型。"]],"code":"use std::borrow::Cow;\nuse std::fmt;\nstruct UserId(u64);\nimpl fmt::Display for UserId {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        write!(f, \"user-{}\", self.0)\n    }\n}\nfn normalize(text: &str) -> Cow\u003c'_, str> {\n    if text.contains('_') { Cow::Owned(text.replace('_', \"-\")) }\n    else { Cow::Borrowed(text) }\n}\nfn main() {\n    println!(\"{} {}\", UserId(7), normalize(\"rust_notes\"));\n    assert!(matches!(normalize(\"rust\"), Cow::Borrowed(_)));\n}","output":"user-7 rust-notes","pitfall":"From 不应通过 panic 来伪装可失败转换。输入可能不合法时使用 TryFrom 或显式 Result 构造器。","task":"实现 ex11：把下划线替换成短横线，返回 Cow\u003cstr>；没有下划线时必须走 Borrowed 路径。","hint":"测试不仅检查字符串值，还用 matches! 检查 Borrowed 与 Owned 变体。","answer":"if text.contains('_') { Cow::Owned(text.replace('_', \"-\")) } else { Cow::Borrowed(text) }。这体现值相同与分配行为相同是两个测试维度。","quiz":[["可能失败的数字转换应该实现？",["TryFrom","From 后随意 panic","Debug"],0,"TryFrom 的错误类型明确表达失败。"],["Cow 的典型用途是？",["借用或拥有两种路径","自动跨线程锁","避免所有内存分配"],0,"修改路径仍可能分配；收益来自无需修改时借用。"]],"source":"https://doc.rust-lang.org/std/borrow/enum.Cow.html"},{"id":"26","phase":4,"title":"Cargo、依赖、features 与 edition","subtitle":"把可重复构建作为项目的一部分。","sections":[["清单和锁文件负责不同事情","Cargo.toml 声明包、目标和依赖约束；Cargo.lock 记录解析后的依赖版本。应用通常应保留锁文件，让部署和 CI 使用 --locked 检查它没有悄悄改变。--offline 只能使用已缓存依赖，不会让缺少的依赖凭空出现；本项目核心练习与综合项目零第三方依赖。"],["features 与 workspace","feature 用于选择可选能力，依赖图中同一包的 features 通常会合并，因此设计时应尽量可叠加。workspace 协调多个包、共享目标目录与配置。本练习包显式放在独立 workspace 中，避免与现有博客工程的依赖和构建策略耦合。dev-dependencies 只用于测试、示例等开发目标，build-dependencies 用于构建脚本。"],["edition 迁移不是盲改一行","edition 是包级选择，不同 edition 的 crate 可以共同工作。迁移旧项目先提交干净基线、运行测试，再参考 cargo fix --edition 和 Edition Guide，最后检查行为变化及 lint。2024 的变化包括部分匹配规则、临时值作用域、unsafe 声明和 impl Trait 捕获规则；不要把本课程当作所有迁移细节的替代。"],["建议的交付检查","本项目提供 cargo fmt --check、cargo test、cargo check --all-targets 和示例运行流程。生产项目还应明确最低支持 Rust 版本、目标平台、依赖更新策略、凭据与构建环境。版本号不是质量保证，升级后要运行与你业务相关的测试。"],["练习的 feature 是怎样切换的","lib.rs 用 cfg 选择 starter 或 solutions 模块，随后以同样的名字重导出函数；同一组测试因此可以验证两套实现。启用 solutions 时不会顺便检查你填写的 starter，做题时一定要回到默认配置。"],["可复现构建还包含平台","锁文件记录依赖解析结果，但本机 C 编译器、系统库与目标平台也可能影响构建。Taskboard 的 SQLite 使用 bundled 特性，从随依赖分发的源码编译，需要 C 工具链；在新机器首次运行应先核对这些前提。"],["本章验收","能解释清单与锁文件；理解 offline 与 locked；会运行不同 features；能说清 edition 不等于版本；知道构建脚本和 proc macro 在构建过程执行。"]],"code":"fn main() {\n    println!(\"{} {}\", env!(\"CARGO_PKG_NAME\"), env!(\"CARGO_PKG_VERSION\"));\n    println!(\"debug_assertions={}\", cfg!(debug_assertions));\n}","output":"rust-reboot-workbook 0.1.0\ndebug_assertions=true（默认 debug profile）","pitfall":"features 不是独立进程隔离或权限系统。把敏感操作藏在 feature 后不等于具有运行时访问控制。","task":"打开 workbook/Cargo.toml，解释 default = [] 与 solutions = []。先运行默认测试，再运行 --features solutions 对比。","hint":"默认路径加载 starter.rs，solutions feature 加载 solutions.rs；两者接受同一组测试。","answer":"默认测试失败代表练习尚未完成，并不是项目损坏。--features solutions 检验参考实现；做题时不要一直打开 solutions，否则测到的不是你的代码。","quiz":[["--offline 能下载缺失依赖吗？",["能","不能","只下载 dev-dependencies"],1,"offline 只能使用本地可用资源。"],["不同 edition 的 crate 能一起使用吗？",["能","不能","只能同一作者"],0,"edition 的选择逐包生效，生态兼容性设计允许它们互操作。"]],"source":"https://doc.rust-lang.org/edition-guide/rust-2024/index.html"},{"id":"27","phase":4,"title":"文件、路径与持久化","subtitle":"磁盘不是一个永远成功的 HashMap。","sections":[["路径不等于 UTF-8 文本","Path/PathBuf 表示平台路径，OsStr/OsString 表示系统字符串；不要随意 to_str().unwrap()。read_to_string 要求文件内容是有效 UTF-8；读取任意二进制用 read。BufRead::lines 可流式逐行处理，但每行也可能产生 I/O 或解码错误，不能简单 flatten 丢弃。"],["区分不存在和损坏","文件不存在可以根据业务创建空数据库；权限错误、非法编码、格式损坏不应该被当成空数据继续覆盖。解析时验证字段数量、ID 唯一性、状态枚举和文本转义规则。综合项目采用严格行格式，拒绝损坏输入并保留原文件。"],["写入、替换与平台差异","直接覆盖文件时，崩溃或写入失败可能留下不完整内容。常见改进是写同目录临时文件、flush/sync，再替换旧文件；但替换原子性、覆盖行为、目录持久化和多进程并发依赖具体平台与文件系统，不能仅凭 rename 就宣布事务安全。本课程参考实现明确是单进程学习版本，写入前保留备份，不宣称崩溃原子性。"],["可测试 I/O 设计","纯函数负责 encode/decode，边界函数负责 read/write。测试在独立临时目录工作，验证往返、损坏输入、空文件、备份和重载。真正要支持多人或多进程写入时，应采用可靠锁协议或数据库，并设计迁移和恢复流程。"],["I/O 错误不能被默认值掩盖","reader.lines() 的每一项也是 Result，line? 处理读取错误，parse()? 再处理格式错误。空行是示例明确允许跳过的业务规则；坏数字没有被当成空白忽略。把两类错误混为一谈会让数据损坏更难排查。"],["从文件备份走向数据库事务","入门 CLI 展示序列化与备份，但备份不是事务。升级项目使用 SQLite，把任务行、标签和审计记录放在同一事务中；中途失败时自动回滚。即便有事务，备份、迁移和恢复仍是另外需要设计的流程。"],["本章验收","使用 PathBuf 处理文件名；区分 NotFound 与其他错误；实现严格编解码；能解释 write、flush、sync 和事务不是同一层保证。"]],"code":"use std::io::{self, BufRead, Cursor};\nfn read_numbers(reader: impl BufRead) -> Result\u003cVec\u003ci32>, Box\u003cdyn std::error::Error>> {\n    let mut values = Vec::new();\n    for line in reader.lines() {\n        let line = line?;\n        if line.trim().is_empty() { continue; }\n        values.push(line.trim().parse()?);\n    }\n    Ok(values)\n}\nfn main() -> Result\u003c(), Box\u003cdyn std::error::Error>> {\n    let input = Cursor::new(b\"10\\n\\n20\\n\");\n    println!(\"{:?}\", read_numbers(input)?);\n    let _kind = io::ErrorKind::NotFound;\n    Ok(())\n}","output":"[10, 20]","pitfall":"unwrap_or_default 处理文件读取错误可能把权限问题或数据损坏误当成“空数据库”，然后覆盖原数据。","task":"实现 ex12：给任务标题转义反斜线、制表符与换行，再实现严格反转义。非法 \\q 和末尾单独反斜线返回错误。","hint":"encode 用 chars 遍历；decode 遇到反斜线后消费下一项并匹配 n、t、反斜线。","answer":"转义必须先定义协议：\\\\ 表示反斜线，\\t 表示制表符，\\n 表示换行。测试 decode(encode(text)) == text，同时测试非法转义而不是默默保留它。","quiz":[["文件读取报 PermissionDenied 应默认清空数据吗？",["应该","不应该，应传播错误","忽略后覆盖"],1,"读失败不等于不存在，错误恢复不能破坏已有数据。"],["任意路径适合保存为 String 吗？",["不一定，应使用 PathBuf","总是","只有 Linux 例外"],0,"平台路径不保证能无损表示为 UTF-8 字符串。"]],"source":"https://doc.rust-lang.org/std/io/trait.BufRead.html"},{"id":"28","phase":4,"title":"性能、调试与常见编译错误","subtitle":"先测量，再改变数据结构。","sections":[["优化顺序","先确认正确性和工作负载，再用 release 构建测量。首先检查算法复杂度、I/O 次数和分配，再看复制、锁竞争与缓存局部性。微基准应防止常量折叠和死代码删除；std::hint::black_box 能辅助构造基准，但不能保证测量天然可靠。"],["常见低风险改进","已知大小时预留 Vec 容量；只读参数使用切片；避免为查找创建 String；把循环外不变计算移出循环；迭代器直接归约避免中间 Vec。不要默认手写下标比迭代器快，也不要默认每个 clone 都昂贵。Rc::clone 和 String::clone 的成本模型不同。"],["把错误码转成设计问题","E0382 常提示移动后继续使用，问“是否只需借用”；E0499 常提示多次可变借用，问“是否需要拆分数据或作用域”；E0502 常提示共享与可变借用重叠，问“引用最后使用能否提前”；E0597 常提示借用值不够长寿，问“应拥有还是借用”；E0277 常提示 trait 约束不满足，问“实际类型提供何种能力”。"],["更深的工具有适用边界","Clippy 检查模式，Miri 动态执行并发现部分 UB，性能分析器定位热点，sanitizer 需要相应工具链与平台。不要用关闭检查、任意 unsafe 或无差别 Arc\u003cMutex\u003c_>> 来解决理解问题。性能优化应有前后相同场景的测量与测试证据。"],["识别示例没有证明什么","Instant 只记录本次运行的时长；black_box 帮助减少优化消除，但没有控制机器负载、缓存、CPU 调频或统计误差。示例证明“如何测量”，不证明某个算法更快。真正结论需要足够数据和一致场景。"],["把优化结果写成可审查记录","保留输入规模、构建模式、运行次数、结果分布和正确性测试。一次减少分配的改动若让 API 难用很多，也要说明权衡。对服务端还应测延迟分位数、吞吐和资源占用，而不是只看平均时间。"],["本章验收","能通过错误码定位设计问题；知道先优化算法和 I/O；能构造不依赖单次噪声的测量；不用 unsafe 或无条件 clone 避开理解。"]],"code":"use std::hint::black_box;\nuse std::time::Instant;\nfn main() {\n    let values: Vec\u003cu64> = (0..10_000).collect();\n    let start = Instant::now();\n    let total: u64 = black_box(&values).iter().sum();\n    let elapsed = start.elapsed();\n    assert_eq!(total, 49_995_000);\n    println!(\"sum={total}; elapsed={elapsed:?}\");\n    // 单次时长只作工具演示，不构成可信性能结论。\n}","output":"sum=49995000; elapsed=…（时间依机器和运行情况而变化）","pitfall":"一次 debug 构建的计时不能用来比较算法性能；短任务还容易被计时噪声、调度和缓存状态影响。","task":"把求和改成先 map 收集再 sum 与直接 sum 两版，保持断言一致。思考如何构造足够大、可重复的基准。","hint":"首先确认两版做同样的工作；分配是否纳入计时必须保持一致。","answer":"使用 release、多个输入规模和重复测量，记录环境并防止优化器移除计算。若测量差异不稳定，应报告不确定，不能挑最快一次下结论。","quiz":[["遇到 E0382 首先应思考？",["谁拥有值、是否只需借用","把所有值 clone","加 unsafe"],0,"所有权设计通常比补 clone 更重要。"],["单次 debug 计时足以证明优化有效吗？",["足以","不足以","只要数字小就行"],1,"构建配置和噪声会严重影响判断。"]],"source":"https://doc.rust-lang.org/error_codes/error-index.html"},{"id":"29","phase":5,"title":"综合项目：从 CLI 到 Taskboard","subtitle":"从标准库任务工具，走向 SQLite 与异步 HTTP 服务。","sections":[["你要完成的产品","Rust Trail 是本地学习任务管理器，支持 add、list、done、remove、find、stats。任务包含唯一 ID、标题和完成状态，退出后重启仍可读取数据。所有业务规则放在 lib.rs，main.rs 负责终端交互；零第三方依赖，离线可构建。下载包含完整参考实现，不要求你从页面手抄所有文件。"],["六个可验收里程碑","M1 建立 Task 与 Store，拒绝空标题；M2 完成增加、完成、删除、查询及统计；M3 定义严格的文本序列化和转义；M4 实现文件加载、保存与备份；M5 实现参数解析、帮助和非零错误退出码；M6 完成测试、格式检查与实际重启验证。每完成一层再接下一层，先在内存中验证，再碰文件。"],["关键设计决策","用 enum 表达错误，保留 I/O 来源；ID 使用 checked_add 防止回绕；数据库头部保存 next_id，删除最高 ID 后也不复用旧 ID。解析拒绝重复 ID、非法状态、无效转义或错误头部。查询只借用数据，变更通过 &mut self；编码单独输出 String，便于往返测试。"],["交付边界与升级方向","参考版支持单进程串行使用；更新前创建 .bak 备份，备份失败就停止保存。直接写入仍不是崩溃原子事务，不支持多个进程同时编辑。学习升级任务：可靠替换与恢复、文件锁、SQLite 迁移、标签与截止时间、serde JSON、clap 参数解析。不要把学习版当成已经具备数据库级并发保证的服务。"],["从复习过渡到独立实现","先只看 README 的需求和测试，自己新建一份实现；卡住时回到相应章节，而不是直接复制答案。完成后与 reference 比较错误建模、借用签名、模块边界和测试覆盖。能独立修改格式并迁移旧数据，才说明掌握了组合使用这些语言能力。"],["两级项目，逐步加复杂度","先完成 capstone/ 的零依赖 Rust Trail，理解拥有权与错误边界；再进入 taskboard/，把领域层、SQLite、异步服务、HTTP 和 CLI 拆成独立模块。升级项目增加标签、优先级、分页、版本冲突、审计事件和有界导入队列，完整源码可以在综合项目页面逐文件阅读。"],["一条真实请求如何穿过系统","POST /tasks 的 JSON 先由 Axum 解码为 NewTask；Database::call 获取并发许可并进入 spawn_blocking；Repository 校验输入、开启事务，依次插入 tasks、task_tags、events；提交后返回 Task，HTTP 映射为 201。任一阶段失败都走明确的 Result 错误通路。"],["本章验收","CLI 与 HTTP 使用同一数据库；旧版本更新返回 409；无效批量导入不留下半批数据；后台队列满时拒绝新增；重启保留已提交任务；能从测试定位责任模块。"]],"code":"#[derive(Debug)]\nstruct Task { id: u64, title: String, done: bool }\nfn main() {\n    let mut tasks = vec![Task { id: 1, title: \"复习借用\".into(), done: false }];\n    tasks[0].done = true;\n    let completed = tasks.iter().filter(|task| task.done).count();\n    for task in &tasks { println!(\"{} {} {}\", task.id, task.done, task.title); }\n    println!(\"completed={completed}\");\n    // 完整实现位于 capstone/src/，包含存储、CLI 与错误处理。\n}","output":"1 true 复习借用\ncompleted=1","pitfall":"不要把上面的数据模型缩略示例误当成完整项目；下载包中的 capstone 才包含可运行的全部功能和测试。","task":"按综合项目页面的六个里程碑独立实现。在空目录用 --file 指定演示数据库，依次 add、done、stats，退出重启后 list。","hint":"先复制 capstone/README.md 的验收清单，避免一开始被命令行解析与文件 I/O 分散注意。","answer":"验收需包含：空标题不写入、重复完成返回可解释结果、不存在 ID 报错、Unicode 标题往返一致、损坏文件拒绝覆盖、旧数据有备份、删除后 ID 不复用、命令行错误退出码非零。","quiz":[["持久化读取损坏时应该？",["当成空数据并覆盖","报告错误且保留原文件","随机忽略几行"],1,"恢复策略必须保护原始数据。"],["删除最高 ID 后，新任务 ID 应由什么决定？",["持久化 next_id","当前任务数加一","始终使用 1"],0,"单调 next_id 避免重复使用已删除 ID。"]],"source":"https://doc.rust-lang.org/book/ch12-00-an-io-project.html"},{"id":"30","phase":5,"title":"生态地图与结业复盘","subtitle":"把核心掌握程度和方向性扩展分开。","sections":[["先确认你的核心能力","能在没有提示的情况下解释 move 与 borrow；能选择 &str、String、Cow；能设计 Result 错误通路；能用 trait 与生命周期表达 API；能写确定性测试；能识别线程和 async 的区别；能阅读编译器诊断并通过结构调整解决问题。只记得关键字不足以构成交付能力。"],["按目标选择生态","CLI 方向可以进一步学习 clap、serde、tracing；Web 服务可学习 Tokio、Axum、数据库访问和优雅退出；CPU 密集数据处理可学习 Rayon；嵌入式和系统方向需要进一步学习 no_std、alloc、中断与 FFI。这些是学习方向示例，不表示课程涵盖每个库的全部 API；依赖版本以各项目官方文档和你的锁文件为准。"],["async 实战补充","下载包的 tokio-lab 提供实际运行时示例：并发执行、超时、任务句柄、有界通道和测试。它需要第三方依赖，第一次无缓存时需要网络下载。掌握后可以把综合项目拆成后台服务，但应先增加任务取消、锁范围、输入限额和持久化一致性设计。"],["刻意练习的最后一轮","把 capstone 的文本格式改为版本化 JSON 是序列化练习；把查询返回 Vec\u003c&Task> 是生命周期练习；加入可替换存储 trait 是抽象练习；加入工作线程是 Send/Sync 练习。每次只改变一个设计维度，保留现有验收测试，并新增能暴露这次风险的测试。"],["如何判断可以结业","完成 30 章，不看答案重做 12 个测试驱动练习，测验正确率达到自己设定的阈值，再从零实现综合项目。最后用 5 分钟向别人解释最难的一次借用错误如何解决。之后每周重做一个小变更，保持对编译器反馈的熟悉度。"],["把下一步变成一条具体需求","不要只写“继续学习 Rust”。例如：为 Taskboard 增加按截止时间排序；先在 Filter 中设计选项，再修改 SQL、增加参数验证、补上排序与分页测试，最后更新 API 示例。一次变更会迫使你把类型、错误和测试重新连接起来。"],["用解释检验是否真正掌握","如果你只能说“加了 clone 就好了”，还没有理解所有权；如果能解释调用者为何仍需拥有数据、借用为何无法跨越任务生命周期、复制成本为何可接受，就已经做出了可审查的设计决定。把这种解释写进笔记。"],["本章验收","独立完成全部练习；自己实现一次跨模块变更；不看答案解释最难的三个问题；能明确区分已经验证的行为、设计限制与未来扩展。"]],"code":"fn main() {\n    let checklist = [\"ownership\", \"errors\", \"tests\", \"concurrency\", \"delivery\"];\n    for (index, item) in checklist.iter().enumerate() {\n        println!(\"{}. {item}\", index + 1);\n    }\n}","output":"1. ownership\n2. errors\n3. tests\n4. concurrency\n5. delivery","pitfall":"“完整复习核心语言与工程链路”不等于涵盖所有生态库、所有 unsafe 证明或所有平台细节。进一步学习应围绕实际目标。","task":"写一篇 300 字复盘，解释你在所有权、错误处理、异步三个领域各修正了什么误解，并列出下一周一个可验收任务。","hint":"用自己的失败案例解释，尽量不用只重复教材定义的句子。","answer":"合格复盘包含具体代码变化、原先错误的心智模型、测试证据和剩余疑问。例如把返回临时借用改为返回 String，并说明为何生命周期标注无法修复原实现。","quiz":[["下列哪个更能证明恢复 Rust 能力？",["记住所有关键字","独立实现并测试一次需求变更","只读答案"],1,"组合能力和反馈修正比被动熟悉更可靠。"],["下一步学习第三方库时应？",["核对官方文档与项目版本","假定所有示例永久不变","只看 crate 名"],0,"版本、特性和运行时假设都会影响示例是否适用。"]],"source":"https://tokio.rs/tokio/tutorial"}],"phases":[["重新上手","01—03","工具链、类型与表达式"],["重建核心模型","04—09","所有权、借用与数据建模"],["写出地道 Rust","10—17","集合、抽象、生命周期与测试"],["掌握进阶机制","18—24","智能指针、并发、异步与 unsafe"],["走向工程实践","25—28","API、Cargo、I/O 与性能"],["完成一次交付","29—30","综合项目与后续学习"]],"exercises":[["ex01","checked_byte","02","范围转换","u16 → Option\u003cu8>，拒绝超出 255 的值"],["ex02","clamp_negatives","05","原地修改","借用切片，把负数归零，不新增分配"],["ex03","first_word","06","字符串切片","借用首个单词，正确处理空白与 Unicode"],["ex04","parse_numbers","09","错误传播","严格解析 CSV 整数，任一错误整体失败"],["ex05","word_counts","10","集合聚合","按空白分词并转小写，返回有序词频"],["ex06","even_square_sum","11","迭代器","偶数平方和，先转 i64 再平方"],["ex07","counter","12","有状态闭包","返回每次递增的 FnMut 闭包"],["ex08","generic_max","13","泛型借用","最大元素的借用，无 Clone 约束"],["ex09","longer","15","生命周期","按字节长度选择更长的输入切片"],["ex10","parallel_sum","19","作用域线程","两线程并行借用切片求和"],["ex11","normalize","25","Cow","只在确实需要替换下划线时分配"],["ex12","escape / unescape","27","严格文本协议","转义往返与非法输入检测"]],"plan":[["第 1 天","01—03","跑通工具链；恢复类型、函数、控制流"],["第 2 天","04—05","画所有权流向；手写借用案例"],["第 3 天","06—08","完成文本与数据建模；练习 01—03"],["第 4 天","09—10","错误传播与集合；练习 04—05"],["第 5 天","11—12","迭代器与闭包；练习 06—07"],["第 6 天","13—15","泛型、trait、生命周期；练习 08—09"],["第 7 天","16—17","模块与测试；回做第一周错题"],["第 8 天","18—20","智能指针、线程与同步；练习 10"],["第 9 天","21—22","Future、Pin；运行 Tokio 练习"],["第 10 天","23—24","宏与 unsafe；把裸指针示例改回 safe"],["第 11 天","25—28","API、Cargo、I/O、性能；练习 11—12"],["第 12 天","29 · M1—M3","综合项目：模型、业务、格式"],["第 13 天","29 · M4—M6","综合项目：持久化、CLI、验收"],["第 14 天","30 · 复盘","重做错题；从空文件实现一个新需求"]],"projectGuide":[{"id":"01","title":"先跑起来，再看一条请求的全程","summary":"建立可观察的反馈循环，避免一开始陷入框架细节。","sections":[["准备环境","使用 Rust 1.97.1 或更新的稳定工具链；Windows 需要 MSVC C++ 构建工具，Linux 通常需要 C 编译器与构建工具。rusqlite 使用 bundled SQLite，会在构建时编译数据库 C 源码，不要求预先安装 SQLite 服务。第一次下载依赖需要联网，之后已缓存时可 --offline。"],["目录就是责任边界","domain.rs 定义合法输入与 Task；repository.rs 封装 SQLite；service.rs 把同步操作带到阻塞线程；api.rs 将 HTTP 转为业务调用；jobs.rs 处理有界导入任务。src/bin 下的 server 与 cli 共享 lib.rs，不复制一套领域规则。"],["先观察三个证据","启动时应打印回环监听地址和 SQLite 路径；GET /health 返回 status=ok；POST /tasks 返回 201 和 version=1。随后关闭程序再启动，GET /tasks 仍应包含刚才的记录。默认只监听 127.0.0.1:4318，不与博客端口冲突。"],["不要一口气读所有代码","先读 NewTask::validate，再读 Repository::create，然后读 create handler，最后补 Database::call。这样你会先理解业务正确性，再理解调度边界。把每一层的输入、输出和可能失败写在纸上。"]],"code":"cd taskboard\ncargo test --locked\ncargo run --locked --bin taskboard-server\n# 另开一个 PowerShell\nInvoke-RestMethod http://127.0.0.1:4318/health","exercise":"改默认端口为 4319，说明配置值在哪个模块读取；不要改业务层。"},{"id":"02","title":"领域模型：让输入先变得可靠","summary":"先定义什么是合法任务，再讨论怎么保存它。","sections":[["字段约束的精确含义","title 在 trim 后需要 1—120 个 Unicode 标量值，拒绝控制字符；description 最多 4000 个标量值；priority 是 1—3；due_at 为非负 Unix 秒数或 null；最多 8 个标签，每个标签 trim、转小写、长度 1—24，再排序去重。这里的“字符”不是字素簇，文档明确避免混淆。"],["创建与更新为何不同类型","NewTask 没有 id、version 或 status，这些由服务产生。UpdateTask 是完整替换输入，必须提供 expected_version 与 status；缺省 description/tags 会清空相应内容，due_at 缺省或 null 表示清除。采用 PUT 而不是伪装成 PATCH，避免把“未提供”和“清空”混在一起。"],["状态转换是业务规则","Todo、Doing、Done 是 enum。允许一般推进、直接完成与重新打开，但 Done → Doing 被拒绝，必须先回到 Todo，表达明确的重开动作。同状态更新仍会增加版本并记录 updated，这不是幂等写 API。"],["为何公开输入字段仍要验证","Serde 负责把 JSON 形状转为 Rust 类型，并通过 deny_unknown_fields 拒绝拼错字段；它不能代替领域验证，例如空标题仍是合法 String。CLI、HTTP 和批量导入最终都必须经过同一个 validate。"]],"code":"{\n  \"title\": \"读懂 Rust 借用\",\n  \"description\": \"运行 ch05，再完成 ex02\",\n  \"priority\": 3,\n  \"tags\": [\"Rust\", \"ownership\"],\n  \"due_at\": null\n}","exercise":"给 priority 增加枚举包装，保持 JSON 兼容 1—3，并为 0、4 和未知字段写失败测试。"},{"id":"03","title":"SQLite：任务、标签与审计同生共死","summary":"一组业务变化应作为一笔事务提交。","sections":[["三个表如何分工","tasks 保存实体与版本，task_tags 保存多值标签并通过复合主键去重，events 保存创建、更新、删除事件。标签外键使用 ON DELETE CASCADE；审计不依赖删除后仍存在的任务行，所以 events 不设置阻止保留历史的任务外键。"],["一次创建的事务边界","Repository::create 先验证，再开启 Immediate 事务；insert 写任务行、标签与审计；最后 commit。任何一步返回 Err，未提交的 Transaction 被 drop 时回滚。不能在任务写完后就提前返回成功，否则后续标签写入失败会留下不完整业务状态。"],["迁移与运行配置","初始化启用 foreign_keys、WAL 和 3 秒 busy timeout。PRAGMA user_version=1 标记当前结构；发现更高版本时拒绝降级写入。这里是第一版迁移框架，新增字段时应该新增版本迁移并测试旧文件升级，不能直接删表重建。"],["测试必须覆盖中途 SQL 失败","仅用空标题测试回滚不够，因为验证可能在事务前就拒绝了。项目测试额外创建一个触发器，让第二条 INSERT 在数据库层失败，然后断言 tasks 与 events 都为空。这才实际覆盖中途失败后的原子性。"]],"code":"cargo test --locked rollback_on_mid_batch_database_failure\ncargo test --locked invalid_batch_is_all_or_nothing\ncargo test --locked persistence_across_connections_and_stale_writer","exercise":"增加第 2 版迁移，为任务添加 estimate_minutes，保留旧任务，测试从 version=1 升级。"},{"id":"04","title":"版本冲突：避免后写的人悄悄覆盖前者","summary":"锁保护内存，版本号保护跨请求的业务意图。","sections":[["重现一个丢失更新","客户端 A 与 B 都读取 version=1。A 修改标题并提交，数据库变成 version=2。B 仍基于旧内容提交，若只按 id 更新，会把 A 的修改覆盖。请求携带 expected_version=1 后，B 得到 409 version_conflict，并需要重新读取、合并意图再提交。"],["实现有两层防线","事务中先读取旧任务，检查旧版本与输入一致；UPDATE 的 WHERE 同时包含 id 和 version，并检查受影响行数。版本增量用 checked_add，避免整数边界静默回绕。DELETE 同样要求 expected_version，避免删除一个自己没见过的新版本。"],["为什么 Mutex 仍不够","Mutex 只能把服务器内部对 Connection 的访问串行化，不知道浏览器上用户看到的是几秒前的数据；CLI 还可能从另一个进程打开同一数据库。乐观并发控制解决的是业务层陈旧读取，数据库事务解决的是写入一致性，两者互补。"],["冲突后的正确客户端行为","展示冲突，重新读取最新 Task，让用户决定如何合并；不要自动用新版本号重发旧完整对象，否则只是把覆盖动作隐藏起来。重试是否安全取决于操作幂等性，不能把 HTTP 重试和业务重放视为同一件事。"]],"code":"$body = @{ expected_version=1; title=\"更新后的任务\"; priority=3; tags=@(\"rust\"); status=\"doing\"; due_at=$null } | ConvertTo-Json\nInvoke-RestMethod -Method Put -Uri http://127.0.0.1:4318/tasks/1 -ContentType \"application/json; charset=utf-8\" -Body ([Text.Encoding]::UTF8.GetBytes($body))\n# 再发同一个 expected_version=1，预期 HTTP 409","exercise":"编写两个并发 HTTP 更新的测试，断言恰好一次成功、一次 409，最终 version=2。"},{"id":"05","title":"查询：筛选、排序和分页不是一个 for 循环","summary":"明确查询语义，避免输出顺序和总数漂移。","sections":[["组合条件与确定性排序","支持 q、status、priority、tag、limit、offset。q 在标题和描述中作子串查找，SQLite lower 对 ASCII 大小写有效，中文按原字符匹配，不承诺完整 Unicode 折叠。结果始终按 priority DESC、id DESC 排序，保证同一状态下分页顺序确定。"],["参数是数据，不是 SQL 片段","查询谓词由固定程序代码组成，用户值通过 named_params 绑定。字符串 \"' OR 1=1 --\" 只会被当成搜索内容，不会改变 SQL 结构。若未来增加排序字段，应通过 enum 映射到固定白名单，而不是把任意输入直接拼成 ORDER BY。"],["边界和性能取舍","limit 只允许 1—100，offset 只允许 0—1000000。Page\u003cT> 同时返回 items、total、limit、offset。读取任务标签的实现为每个任务追加一次小查询，便于教学但存在 N+1 开销；规模上去后应批量读取或 JOIN，先用性能数据证明瓶颈。"],["不要把导出当成备份","/export 和 CLI export 导出便携 NewTask 内容，不保留原 ID、完成状态、版本和审计；再次导入会创建新的 Todo 任务。它用于模板和内容迁移，不是灾难恢复。真正备份数据库要选择 SQLite 支持的在线备份或停机一致性流程。"]],"code":"Invoke-RestMethod \"http://127.0.0.1:4318/tasks?q=Rust&priority=3&tag=rust&limit=10&offset=0\"\nInvoke-RestMethod http://127.0.0.1:4318/stats\nInvoke-RestMethod http://127.0.0.1:4318/events","exercise":"在不拼接用户 SQL 的前提下添加 sort=created|priority；为同优先级任务和第二页结果写测试。"},{"id":"06","title":"同步数据库如何接入异步 HTTP","summary":"弄清楚被阻塞的是哪个线程，锁由谁持有。","sections":[["Connection 的共享边界","Repository 拥有 rusqlite::Connection；Database 用 Arc\u003cMutex\u003cRepository>> 提供共享所有权与串行访问。Connection 不是 Sync，因此不能直接放在普通共享引用后跨线程并发调用。Mutex 不会让数据库本身变成并行执行，它只组织访问。"],["逐步阅读 Database::call","先 try_acquire_owned 获取 32 个许可之一；克隆 Arc 句柄；spawn_blocking 把拥有的闭包交给阻塞池；工作线程内部获取标准 Mutex，运行纯同步操作；返回 Result\u003cT>。F 和 T 都满足 Send + static，因此需要把提取到的输入 move 进闭包。"],["许可必须跟着真实工作走","把 permit 移进 spawn_blocking 闭包，直到工作真正结束才释放。如果许可只留在 async 外层，当客户端取消请求时它会提前析构，而同步 SQL 仍可能继续执行，资源限额就不再准确。这里体现取消语义会影响看似简单的资源管理。"],["为什么仍然有吞吐限制","一个连接加互斥锁使数据库操作串行，适合这个教学系统。需要更高吞吐时应评估连接池、读写分离、事务长度和 SQLite 写锁行为。不能只把 Semaphore 从 32 改成几千，就宣称系统已经具备高并发能力。"]],"code":"// 关键调用形态：拥有输入，跨越异步任务边界\nlet task = state.database\n    .call(move |repository| repository.create(input))\n    .await?;","exercise":"故意把 MutexGuard 放到 await 之前保留，记录编译器或调度问题，再用当前分层结构解释正确边界。"},{"id":"07","title":"后台任务：有界队列、状态与优雅结束","summary":"接收成功与任务完成，是两个不同的事件。","sections":[["状态模型","POST /jobs/import 校验 1—100 条 NewTask，尝试放入容量为 8 的队列，成功返回 202 和 job ID。worker 把 Queued 改为 Running，执行一笔批量事务，再写 Succeeded 或 Failed。客户端通过 GET /jobs/{id} 查询结果；202 不表示 SQL 已提交。"],["背压与内存上限","try_send 在队列满时返回 Busy，对应 HTTP 503；不会无限创建等待任务。历史最多保留 256 条，达到上限时淘汰最旧的终态记录。Job ID 单调递增，允许由于拒绝而出现空洞，调用者不能依赖 ID 连续。"],["关闭时如何排空","server 接收 Ctrl+C 后停止接收新连接并等待在途请求；Router 的状态随后释放，主函数再 drop 最后一个 Jobs sender；worker 读完已有队列后收到 None 并退出，主函数 await 它。这是有顺序的生命周期管理，不是简单 abort 所有任务。"],["恢复与重复投递的限制","job 记录与队列只在内存中，崩溃重启会丢失；已经提交到 SQLite 的任务不会因此消失。若客户端没看到成功后重发相同批次，可能重复创建任务。可靠队列、幂等键和 outbox 是明确的后续作业，本版不宣称 exactly-once。"]],"code":"$batch = @(@{title=\"复习事务\";priority=3},@{title=\"完成并发测试\";priority=2}) | ConvertTo-Json\n$job = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4318/jobs/import -ContentType \"application/json; charset=utf-8\" -Body ([Text.Encoding]::UTF8.GetBytes($batch))\nInvoke-RestMethod \"http://127.0.0.1:4318/jobs/$($job.id)\"","exercise":"增加 idempotency_key，持久保存提交结果；设计崩溃恢复和重复提交测试，先写语义再写实现。"},{"id":"08","title":"验收、扩展与把项目写成一篇博客","summary":"用可重复证据说明做了什么，也说明还没解决什么。","sections":[["三层验收","领域与 Repository 测试检查验证、排序、版本和事务；HTTP 测试通过 tower::ServiceExt::oneshot 发送真实 Request，检验状态码和 JSON；文件测试用独立临时目录验证关闭重开后仍有数据。还应实际启动进程，用终端访问监听端口。"],["先故意改坏一次","删掉 UPDATE 的版本校验，冲突测试应失败；让 import 逐条提交，中途数据库失败的测试应暴露半批数据；忘记关闭 sender，关闭测试应超时。能检测回归的测试比只证明样例成功的测试更有价值。"],["逐步提升复杂度","A 级：增加任务排序与筛选；B 级：增加版本 2 迁移与截止时间索引；C 级：实现数据库在线备份；D 级：持久任务队列与幂等请求；E 级：用户身份与每用户数据隔离。每级都应有接口定义、失败场景、测试和文档。"],["交付时诚实说明边界","服务仅允许回环监听，没有账户权限系统；导出不是完整备份；后台队列不持久化；单连接限制吞吐；SQL 搜索不是完整 Unicode 语言学搜索。把这些写清楚不会降低项目价值，反而说明你理解了实现真正提供的保证。"]],"code":"cargo fmt --check\ncargo test --locked\ncargo run --locked --bin taskboard-cli -- --db demo.sqlite add \"独立扩展一次需求\" 3\ncargo run --locked --bin taskboard-cli -- --db demo.sqlite list\ncargo run --locked --bin taskboard-cli -- --db demo.sqlite stats","exercise":"写一篇复盘：请求流、一个真实修复、三条测试证据、两项限制，以及下一次可验收扩展。"}],"projectFiles":[{"path":"Cargo.toml","code":"[package]\nname = \"rust-taskboard\"\nversion = \"0.1.0\"\nedition = \"2024\"\npublish = false\ndefault-run = \"taskboard-server\"\n\n[workspace]\n\n[dependencies]\naxum = \"=0.8.9\"\ntokio = { version = \"1\", features = [\"macros\", \"rt-multi-thread\", \"net\", \"sync\", \"signal\", \"time\"] }\nserde = { version = \"1\", features = [\"derive\"] }\nserde_json = \"1\"\nrusqlite = { version = \"=0.41.1\", features = [\"bundled\"] }\n\n[dev-dependencies]\ntower = { version = \"0.5\", features = [\"util\"] }\n"},{"path":"src/domain.rs","code":"use crate::error::{Error, Result};\nuse serde::{Deserialize, Serialize};\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"snake_case\")]\npub enum Status {\n    Todo,\n    Doing,\n    Done,\n}\nimpl Status {\n    pub fn as_str(self) -> &'static str {\n        match self {\n            Self::Todo => \"todo\",\n            Self::Doing => \"doing\",\n            Self::Done => \"done\",\n        }\n    }\n    pub fn parse(value: &str) -> Result\u003cSelf> {\n        match value {\n            \"todo\" => Ok(Self::Todo),\n            \"doing\" => Ok(Self::Doing),\n            \"done\" => Ok(Self::Done),\n            _ => Err(Error::Invalid(\"status 只能是 todo/doing/done\".into())),\n        }\n    }\n    pub fn allows(self, next: Self) -> bool {\n        // 完成后如需再次进行，必须明确先重新打开为 Todo。\n        self == next || !matches!((self, next), (Self::Done, Self::Doing))\n    }\n}\nfn normal_priority() -> u8 {\n    2\n}\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct NewTask {\n    pub title: String,\n    #[serde(default)]\n    pub description: String,\n    #[serde(default = \"normal_priority\")]\n    pub priority: u8,\n    #[serde(default)]\n    pub tags: Vec\u003cString>,\n    #[serde(default)]\n    pub due_at: Option\u003ci64>,\n}\nimpl NewTask {\n    pub fn simple(title: impl Into\u003cString>) -> Self {\n        Self {\n            title: title.into(),\n            description: String::new(),\n            priority: 2,\n            tags: vec![],\n            due_at: None,\n        }\n    }\n    pub fn validate(mut self) -> Result\u003cSelf> {\n        self.title = self.title.trim().to_owned();\n        if self.title.is_empty()\n            || self.title.chars().count() > 120\n            || self.title.chars().any(char::is_control)\n        {\n            return Err(Error::Invalid(\n                \"title 需为 1—120 个 Unicode 标量值，不含控制字符\".into(),\n            ));\n        }\n        if self.description.chars().count() > 4000 {\n            return Err(Error::Invalid(\"description 最多 4000 个标量值\".into()));\n        }\n        if !(1..=3).contains(&self.priority) {\n            return Err(Error::Invalid(\"priority 必须为 1、2、3\".into()));\n        }\n        if self.due_at.is_some_and(|t| t \u003c 0) {\n            return Err(Error::Invalid(\"due_at 必须为非负 Unix 秒数或 null\".into()));\n        }\n        if self.tags.len() > 8 {\n            return Err(Error::Invalid(\"最多 8 个标签\".into()));\n        }\n        for tag in &mut self.tags {\n            *tag = tag.trim().to_lowercase();\n            if tag.is_empty() || tag.chars().count() > 24 || tag.chars().any(char::is_control) {\n                return Err(Error::Invalid(\"标签长度应为 1—24 且不含控制字符\".into()));\n            }\n        }\n        self.tags.sort();\n        self.tags.dedup();\n        Ok(self)\n    }\n}\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct UpdateTask {\n    pub expected_version: i64,\n    pub title: String,\n    #[serde(default)]\n    pub description: String,\n    pub priority: u8,\n    #[serde(default)]\n    pub tags: Vec\u003cString>,\n    pub status: Status,\n    pub due_at: Option\u003ci64>,\n}\nimpl UpdateTask {\n    pub fn from_task(task: &Task) -> Self {\n        Self {\n            expected_version: task.version,\n            title: task.title.clone(),\n            description: task.description.clone(),\n            priority: task.priority,\n            tags: task.tags.clone(),\n            status: task.status,\n            due_at: task.due_at,\n        }\n    }\n    pub fn validated_values(&self) -> Result\u003cNewTask> {\n        if self.expected_version \u003c 1 {\n            return Err(Error::Invalid(\"expected_version 必须为正数\".into()));\n        }\n        NewTask {\n            title: self.title.clone(),\n            description: self.description.clone(),\n            priority: self.priority,\n            tags: self.tags.clone(),\n            due_at: self.due_at,\n        }\n        .validate()\n    }\n}\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct Task {\n    pub id: i64,\n    pub title: String,\n    pub description: String,\n    pub priority: u8,\n    pub status: Status,\n    pub tags: Vec\u003cString>,\n    pub due_at: Option\u003ci64>,\n    pub version: i64,\n    pub created_at: i64,\n    pub updated_at: i64,\n}\nfn default_limit() -> i64 {\n    20\n}\n#[derive(Debug, Clone, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct Filter {\n    pub q: Option\u003cString>,\n    pub status: Option\u003cStatus>,\n    pub priority: Option\u003cu8>,\n    pub tag: Option\u003cString>,\n    #[serde(default = \"default_limit\")]\n    pub limit: i64,\n    #[serde(default)]\n    pub offset: i64,\n}\nimpl Default for Filter {\n    fn default() -> Self {\n        Self {\n            q: None,\n            status: None,\n            priority: None,\n            tag: None,\n            limit: 20,\n            offset: 0,\n        }\n    }\n}\nimpl Filter {\n    pub fn validate(&self) -> Result\u003c()> {\n        if !(1..=100).contains(&self.limit) || !(0..=1_000_000).contains(&self.offset) {\n            return Err(Error::Invalid(\n                \"limit 需为 1—100，offset 需为 0—1000000\".into(),\n            ));\n        }\n        if self.priority.is_some_and(|p| !(1..=3).contains(&p)) {\n            return Err(Error::Invalid(\"priority 必须为 1—3\".into()));\n        }\n        if self.q.as_ref().is_some_and(|q| q.len() > 512)\n            || self.tag.as_ref().is_some_and(|t| t.len() > 128)\n        {\n            return Err(Error::Invalid(\"筛选文本过长\".into()));\n        }\n        Ok(())\n    }\n}\n#[derive(Debug, Serialize, Deserialize)]\npub struct Page\u003cT> {\n    pub items: Vec\u003cT>,\n    pub total: i64,\n    pub limit: i64,\n    pub offset: i64,\n}\n#[derive(Debug, Serialize, Deserialize, PartialEq, Eq)]\npub struct Stats {\n    pub total: i64,\n    pub todo: i64,\n    pub doing: i64,\n    pub done: i64,\n}\n#[derive(Debug, Serialize, Deserialize)]\npub struct Event {\n    pub id: i64,\n    pub task_id: i64,\n    pub action: String,\n    pub at: i64,\n}\n"},{"path":"src/error.rs","code":"use std::{error::Error as StdError, fmt};\n\n#[derive(Debug)]\npub enum Error {\n    Invalid(String),\n    NotFound(i64),\n    Conflict,\n    Busy,\n    Database(rusqlite::Error),\n    Internal(String),\n}\npub type Result\u003cT> = std::result::Result\u003cT, Error>;\nimpl fmt::Display for Error {\n    fn fmt(&self, f: &mut fmt::Formatter\u003c'_>) -> fmt::Result {\n        match self {\n            Self::Invalid(s) => write!(f, \"输入不合法：{s}\"),\n            Self::NotFound(id) => write!(f, \"任务 {id} 不存在\"),\n            Self::Conflict => write!(f, \"版本已变化，请重新读取后再修改\"),\n            Self::Busy => write!(f, \"服务繁忙，请稍后重试\"),\n            Self::Database(e) => write!(f, \"数据库错误：{e}\"),\n            Self::Internal(s) => write!(f, \"内部错误：{s}\"),\n        }\n    }\n}\nimpl StdError for Error {\n    fn source(&self) -> Option\u003c&(dyn StdError + 'static)> {\n        if let Self::Database(e) = self {\n            Some(e)\n        } else {\n            None\n        }\n    }\n}\nimpl From\u003crusqlite::Error> for Error {\n    fn from(e: rusqlite::Error) -> Self {\n        Self::Database(e)\n    }\n}\n"},{"path":"src/repository.rs","code":"use crate::{\n    domain::*,\n    error::{Error, Result},\n};\nuse rusqlite::{Connection, OptionalExtension, TransactionBehavior, named_params, params};\nuse std::{\n    path::Path,\n    time::{Duration, SystemTime, UNIX_EPOCH},\n};\n\npub struct Repository {\n    connection: Connection,\n}\nfn now() -> i64 {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_secs() as i64\n}\nimpl Repository {\n    pub fn open(path: impl AsRef\u003cPath>) -> Result\u003cSelf> {\n        Self::initialize(Connection::open(path)?)\n    }\n    pub fn memory() -> Result\u003cSelf> {\n        Self::initialize(Connection::open_in_memory()?)\n    }\n    fn initialize(mut connection: Connection) -> Result\u003cSelf> {\n        connection.busy_timeout(Duration::from_secs(3))?;\n        connection.pragma_update(None, \"foreign_keys\", \"ON\")?;\n        connection.pragma_update(None, \"journal_mode\", \"WAL\")?;\n        let version: i64 = connection.pragma_query_value(None, \"user_version\", |r| r.get(0))?;\n        if version > 1 {\n            return Err(Error::Invalid(\"数据库版本比程序新，拒绝降级写入\".into()));\n        }\n        if version == 0 {\n            let tx = connection.transaction_with_behavior(TransactionBehavior::Immediate)?;\n            tx.execute_batch(\"CREATE TABLE tasks (\n                id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL,\n                description TEXT NOT NULL, priority INTEGER NOT NULL CHECK(priority BETWEEN 1 AND 3),\n                status TEXT NOT NULL CHECK(status IN ('todo','doing','done')),\n                due_at INTEGER, version INTEGER NOT NULL CHECK(version > 0),\n                created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL);\n                CREATE TABLE task_tags (task_id INTEGER NOT NULL REFERENCES tasks(id) ON DELETE CASCADE,\n                    tag TEXT NOT NULL, PRIMARY KEY(task_id,tag));\n                CREATE INDEX tags_lookup ON task_tags(tag,task_id);\n                CREATE INDEX tasks_order ON tasks(priority DESC,id DESC);\n                CREATE TABLE events (id INTEGER PRIMARY KEY AUTOINCREMENT, task_id INTEGER NOT NULL,\n                    action TEXT NOT NULL, at INTEGER NOT NULL);\n
