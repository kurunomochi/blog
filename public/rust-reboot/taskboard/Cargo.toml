[package]
name = "rust-taskboard"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "taskboard-server"

[workspace]

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
