name: Rust Reboot learning projects
on:
  push:
    paths:
      - "public/rust-reboot/**"
      - "docs/rust-reboot/**"
      - "scripts/*rust-reboot*"
      - ".github/workflows/rust-reboot.yml"
  pull_request:
    paths:
      - "public/rust-reboot/**"
      - "docs/rust-reboot/**"
      - "scripts/*rust-reboot*"
      - ".github/workflows/rust-reboot.yml"
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo fmt --manifest-path public/rust-reboot/workbook/Cargo.toml --check
      - run: cargo fmt --manifest-path public/rust-reboot/capstone/Cargo.toml --check
      - run: cargo fmt --manifest-path public/rust-reboot/tokio-lab/Cargo.toml --check
      - run: cargo fmt --manifest-path public/rust-reboot/taskboard/Cargo.toml --check
      - run: cargo test --locked --manifest-path public/rust-reboot/workbook/Cargo.toml --features solutions --all-targets
      - run: cargo test --locked --manifest-path public/rust-reboot/workbook/Cargo.toml --features solutions --doc
      - run: cargo test --locked --manifest-path public/rust-reboot/capstone/Cargo.toml
      - run: cargo test --locked --manifest-path public/rust-reboot/tokio-lab/Cargo.toml
      - run: cargo test --locked --manifest-path public/rust-reboot/taskboard/Cargo.toml
      - run: cargo build --locked --manifest-path public/rust-reboot/taskboard/Cargo.toml
      - run: node scripts/verify-rust-reboot.mjs
      - run: node public/rust-reboot/taskboard/tests/smoke.mjs
